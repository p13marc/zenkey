# cargo-nextest, which CI's `test` job and `just ci` run the suite with.
#
# Most of the suite's time is waiting on real clocks: health.v1's 30 s
# heartbeat, config.v1's deadlines, a constrained face's silence, a router
# per live case. `cargo test` runs its test binaries one after another, so
# those waits added up — 13 min of CI's `test` job (run 1167, 2026-10-20),
# 596 s of it in six files. nextest runs every test as a process of its own,
# across binaries at once, so the waits overlap.
#
# A process per test changes two things a test may lean on. A `static` lock
# no longer keeps two tests apart (budget.rs's `SERIAL` needs none: it
# exists because the sessions of one process share zenoh's receive threads),
# and a counter in a scratch path's name restarts in every process, which is
# why each of those names carries the pid too. Two binaries sharing a fixed
# path now run at once: zenctl's and zenwatch's CLI corpora each keep a
# config home of their own under `target/tmp` for that reason.
#
# `cargo test --workspace` still runs the same tests, one binary at a time.
# nextest does not run doctests; CI runs `cargo test --doc` beside it.

[profile.ci]
# Every failure in one run, not the first.
fail-fast = false
# A hang fails the run at ten minutes, not at the job's three-hour timeout
# (run 1162's `test` sat until 19:40). The slowest test, live_zk2's health
# §8 across a constrained face, takes 200 s.
slow-timeout = { period = "60s", terminate-after = 10 }
# One test per CPU, nextest's default, left as it is. On vm-dev (6 CPUs, as
# vm-runner-01) the suite took 5 min at 6 and 3.5 min at 12, but at 12
# link_face's s10 saw 7 downsampled samples where 4 to 6 fit: its owner's
# 5 s of traffic stretched under the load. Most tests sleep, so the CPUs
# are not the limit; the timing windows are.
