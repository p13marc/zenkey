params      = { endpoint = "string" }
cardinality = 64
optional    = true
gate        = "capability:sdu"
annotations = { "freshness.ttl_s" = 60 }
doc         = "one remote reachable over the medium, and the lanes toward it"

# gate: a netdev whose radio reports its neighbours: a DLEP radio
