# --- telemetry: frames (telemetry.v2, since revision 3.2; #983 T4, #991) ---------------------
# Core §7.7's frame resources: the readings above in packed records (schemas/modem-frames.json),
# for the media whose rate a JSON stream per reading cannot afford. Each field is a series of
# telemetry.v2 (§2.16), named by its `telemetry.series` mirror, which lends it its kind and unit;
# the series is the frame key and the field, never the mirrored stream (§2.17). The epoch is the
# frame's run, in band across a face (§2.19), so a decrease of a counter within one run is no
# longer read as a reset there (README gap 1).
# - One record a frame, its time measured and its cadence the owner's configuration (#981 §1.2):
#   rf0 every minute, LoRa SF9 every 2, SF12 every 15 (#991's per-medium table).
# - Priority `data`, not the readings' `data_low`: no QoS extension on the wire, and the frames
#   share batches with freshness.v2's heartbeat.
# - Every frame resource is optional, gated by the owner's configuration (`config:frames.<name>`):
#   #991's table picks which ones a device publishes, so a device lists the others unavailable.
# - Exposed `link`, so each crosses a face that exposes, whole and never downsampled (link.v1
#   §2.8); the four link streams went back to `host` in 3.2.
# - The ranges and widths are illustrative, and #991 fixes them.

[resources."frames/link"]
kind        = "stream"
type        = "packed:modem-frames#LinkReadings"
priority    = "data"
optional    = true
gate        = "config:frames.link"
frame       = { records = 1, keyframe_every = 1 }
doc         = "the four link readings, which crossed RF as four streams before 3.2"

[resources."frames/link".annotations]
"link.exposure" = "link"
"freshness.ttl_s" = 150

[resources."frames/link".annotations."telemetry.series"]
dropped        = "sdu/dropped_total"
queue_depth    = "sched/queue_depth"
duty_available = "air/duty_cycle_available"
duty_wait_ms   = "air/duty_cycle_wait_ms"

[resources."frames/sdu"]
