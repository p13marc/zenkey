gate        = "capability:registration"
annotations = { "freshness.ttl_s" = 60 }
doc         = "network registration and access technology, as the bearer reports them"

# --- events ------------------------------------------------------------------------------------
# event (D3): a reader that arrives after the radio died must still learn it, and when (v1
# RFC 04 §1.3). v1 rate = "rare": at most 1/h, the rest folded into `occurrences`, so 7d holds
# at most 168 per device.
[resources.oper_change]
kind        = "event"
type        = "json:OperChange"
rate        = "rare"
retention   = "7d"
doc         = "the device's operational status changed — a transition a superseded document cannot preserve"

# event (D3): the device's own words are the one thing that says what is wrong, and `oper`
# keeps only the latest reason. v1 rate = "low": at most 60/h (FAULT_FLOOR), so 1d holds at most
# 1,440. Edge-triggered raised/cleared: alarms.v1 is the later option.
[resources.device_fault]
kind        = "event"
type        = "json:DeviceFault"
rate        = "low"
retention   = "1d"
doc         = "the device's own words about a failure — the string a DeviceError::Device carried"

# event (D3): a swapped terminal under a running driver is a security-relevant record a
# late reader needs. v1 rate = "rare", so 7d holds at most 168.
[resources.identity_change]
kind        = "event"
type        = "json:IdentityChange"
rate        = "rare"
retention   = "7d"
doc         = "the device behind a name changed under a running driver: a terminal swapped, a firmware updated (#122)"

# gate: a device that offers operator actions
# event (D3): the record of a decision an operator made, or of a script refused rather
# than billed, is for readers other than the caller (who has the reply). v1 rate =
# "burst(600/h)": the ceiling, not the typical rate, which `action_interval_s` bounds per
# device; 1d x 600/h = 14,400 is the contract's worst case.
[resources.action_event]
kind        = "event"
type        = "json:ActionEvent"
rate        = "burst(600/h)"
retention   = "1d"
optional    = true
gate        = "capability:actions"
doc         = "an operator action ran or was refused: the action, its arguments, the outcome, what it cost, and the caller-claimed attribution"

# --- operations --------------------------------------------------------------------------------
# v1's `describe` and `introspect` are the contract bundle (zk2/@zk/contract/modem.v3/<sha256>),
# and its five `config/{device}…` procedures are config.v1's (config.v1-binding.md).

[resources."sdu/lanes"]
kind        = "operation"
request     = "json:Empty"
response    = "json:LaneTable"
idempotent  = true
optional    = true
gate        = "capability:sdu"
doc         = "every lane on a device, its QoS, its socket and whether Zenoh is attached"

# gate: a device that offers operator actions: an Iridium terminal's mailbox check
# v1 [[error]] action-refused rides the core `app` envelope as ModemError; v1's guards map to
# the core codes: not in the device's list → not_found, outside the startup allowlist →
# unavailable (cause config), inside action_interval_s or while another runs → busy.
[resources."action/{name}"]
kind        = "operation"
params      = { name = "string" }
cardinality = 8
request     = "json:ActionRequest"
response    = "json:ActionOutcome"
error       = "json:ModemError"
fanout      = "forbidden"
optional    = true
gate        = "capability:actions"
doc         = "run one operator action on the device, now, and report what it did and what it cost — refused outside the startup allowlist, inside its minimum interval, and while another runs"
