# zenoh-modem's LoRa node at SF12 (link.v2, spec/profiles/link/v2.md;
# #988 L5): lora0's router, its SX1262 at 293 bit/s in 51 B tiles under
# the fragment layer, which presents zenoh a 222 B SDU, within EU868's
# 864 s of air a day. Planned as zenohd-rf0.face.toml says, with this
# file as --face-policy.
#
# The transport: at 540 s with 2, each reopen cost more air than the duty
# allows. 3,600 s with 4 puts the keep-alive interval at 900 s, the frame's
# cadence, so the frame replaces every uplink keep-alive: 192 a day idle,
# 0.02 false closes a day at 5 % loss. (#988 L5 ran 1,080 s, whose 270 s
# interval left three keep-alives between two frames, 288 a day and 427 s
# of air, half the duty; #991.) The handshake's 384 bytes take 10.5 s here,
# so the open, accept and interests timeouts are 40 s, and a reply may take
# 16 full batches' air, 98 s.
#
# Across the face: frames/slow every 15 minutes, a full record hourly
# (modem.v3 3.3, #991): all 73 readings in 785 s of air a day, 91 % of the
# duty, lora0's own in 434 s. Its 1,800 s horizon is the face's
# `horizon_s`, so it is liveness evidence here, as 3.2's frames/link was
# not. frames/fast and frames/paid are the faster media's and SBD's
# (`frame_unlisted`), and the chip has no ARQ (`no_arq`).
#
# Events (modem.v3 3.4, #991): the plan lets the three `face/` events cross,
# and `face/device_fault` draws `not_packed`, but lora0's owner publishes
# none at SF12: beside frames/slow's 785 s, `face/oper_change` alone, 2
# tiles an occurrence at 24 a day, reaches 864.04 s of the 864 (link.md,
# "Events"). With lora0's own readings, 434 s, the two `rare` ones would fit.
profile  = "link.v2"
system   = "h-c2a95e41d7f0"
services = ["lora0"]
binding  = "zm-1.10.2-r1"
catalog  = "29bf7d47"

[transport]
lease_ms             = 3600000
keep_alive           = 4
wait_before_close_ms = 3600000
sequence             = "16bit"
batch_bytes          = 224          # the fragment layer's 222 B SDU and 2 B of stream framing
open_timeout_ms      = 40000
accept_timeout_ms    = 40000
interests_timeout_ms = 40000

[face.lora]
far              = "ground"
attach           = "client"
select           = { link_protocols = ["unixsock-stream"] }
class            = "constrained"
expose           = "link"
interval_s       = 900
max_outage_s     = 3600
link_bps         = 293
loss_ppm         = 50000
arq              = false
reply_timeout_ms = 120000
horizon_s        = 1800

# frames/slow writes a full record at least every 4 (modem.v3), hourly at
# one every 15 minutes, as the face asks.
[face.lora.frames]
"modem.v3/frames/slow" = { every_s = 900, keyframe_s = 3600 }
