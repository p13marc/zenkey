# zenoh-modem's RF node (link.v2, spec/profiles/link/v2.md; #988 L5): the
# router of host h-3fa9c2d41b7e, which carries rf0, and its 2,400 bit/s
# radio lane to the ground, attached as a client. One router per medium
# (v2 §2.16): its transport is the router's, for every link it holds.
#
#   zenctl acl gen --enrollment examples/zk2/zenoh-modem/faces/zenoh-modem.enrollment.toml \
#                  --contracts examples/zk2/zenoh-modem \
#                  --contracts spec/profiles/config/config.v1.toml \
#                  --contracts spec/profiles/health/health.v1.toml \
#                  --catalog examples/zk2/zenoh-modem/catalog.json \
#                  --face-policy examples/zk2/zenoh-modem/faces/zenohd-rf0.face.toml --json5
#
# writes the router's `transport` and `routing` blocks beside its access
# control, and `--far-config` the ground end's (v2 §2.18). It replaces
# configs/zenohd-rf0.json5's 10 s lease, 4 keep-alives and 10 s
# `wait_before_close`: at 240 s with 4, an idle link carries 2,880
# keep-alives a day, and at 5 % loss expects 0.36 false closes a day.
#
# Across the face: modem.v3's frames/fast, all 73 readings in one record,
# whole at one a minute and never downsampled, a full record every 15
# (modem.v3 3.3, #991): 177 KB a day with every reading present and 24 of
# them moving, 92 KB for rf0's own. No plain stream crosses (modem.v3 exposes only its
# frames). Its 300 s horizon is liveness evidence. frames/slow and
# frames/paid are LoRa SF12's and SBD's, and draw `frame_unlisted` here: rf0
# does not publish them. The radio repairs no lost frame, so the linter
# warns `no_arq`.
#
# Events (modem.v3 3.4, #991): the face lists the three `face/` events
# (link.v2 0.12 §2.7), which cross whole, and the plan denies the four JSON
# ones by name; `face/device_fault`, JSON, draws `not_packed`. Their worst
# case is 417 KB a day beside the frames' 177 KB, 2.3 % of the radio's
# 25.9 MB (link.md, "Events").
profile  = "link.v2"
system   = "h-3fa9c2d41b7e"
services = ["rf0"]
binding  = "zm-1.10.2-r1"           # the zenoh fork zenoh-modem's routers run
catalog  = "29bf7d47"               # catalog.json, which the ground holds

[transport]
lease_ms             = 240000
keep_alive           = 4            # a keep-alive every 60 s, which a frame a minute replaces
wait_before_close_ms = 240000       # at least the lease
sequence             = "16bit"
batch_bytes          = 222          # the radio's 220 B SDU and 2 B of stream framing
open_timeout_ms      = 10000
accept_timeout_ms    = 10000
interests_timeout_ms = 10000

[face.rf]
far              = "ground"
attach           = "client"
select           = { link_protocols = ["unixsock-stream"] }
class            = "constrained"
expose           = "link"
interval_s       = 60
max_outage_s     = 3600
link_bps         = 2400
loss_ppm         = 50000            # 5 %
arq              = false            # no link ARQ on the radio (zenoh-modem's tracker)
reply_timeout_ms = 15000            # 16 full batches take 11.8 s
horizon_s        = 120              # one frame a minute affords a 120 s horizon
# all three of modem.v3 3.4's events for a face (link.md, "Events")
events           = ["modem.v3/face/device_fault", "modem.v3/face/identity_change", "modem.v3/face/oper_change"]

[face.rf.frames]
"modem.v3/frames/fast" = { every_s = 60 }
