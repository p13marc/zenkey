# zenoh-modem's LoRa node at SF9 (link.v2, spec/profiles/link/v2.md;
# #988 L5): lora0's router, its SX1262 at 1,758 bit/s with 115 B frames,
# under EU868's 864 s of air a day. Planned as zenohd-rf0.face.toml says,
# with this file as --face-policy.
#
# The transport: at 60 s with 2, the keep-alive interval was 30 s, so one
# frame a minute still left a keep-alive between every two. 240 s with 4
# puts the interval at 60 s, which frames/link at one a minute replaces:
# 2,880 keep-alives a day idle, 0.36 false closes a day at 5 % loss.
#
# Across the face: frames/link every minute, where zk2c fits the four link
# readings in 473 s of air a day, and the group frames every two minutes.
# frames/message is SBD's (`frame_unlisted`), and the chip has no ARQ
# (`no_arq`).
profile  = "link.v2"
system   = "h-c2a95e41d7f0"
services = ["lora0"]
binding  = "zm-1.10.2-r1"
catalog  = "ab76ec37"

[transport]
lease_ms             = 240000
keep_alive           = 4
wait_before_close_ms = 240000
sequence             = "16bit"
batch_bytes          = 117          # the chip's 115 B frame and 2 B of stream framing
open_timeout_ms      = 10000
accept_timeout_ms    = 10000
interests_timeout_ms = 10000

[face.lora]
far              = "ground"
attach           = "client"
select           = { link_protocols = ["unixsock-stream"] }
class            = "constrained"
expose           = "link"
interval_s       = 60
max_outage_s     = 3600
link_bps         = 1758
loss_ppm         = 50000
arq              = false
reply_timeout_ms = 15000            # 16 full batches take 8.5 s
horizon_s        = 120

[face.lora.frames]
"modem.v3/frames/link"   = { every_s = 60 }
"modem.v3/frames/sdu"    = { every_s = 120 }
"modem.v3/frames/sched"  = { every_s = 120 }
"modem.v3/frames/air"    = { every_s = 120 }
"modem.v3/frames/layer"  = { every_s = 120 }
"modem.v3/frames/if"     = { every_s = 120 }
"modem.v3/frames/radio"  = { every_s = 120 }
"modem.v3/frames/bearer" = { every_s = 120 }
