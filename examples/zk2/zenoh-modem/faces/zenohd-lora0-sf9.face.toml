# zenoh-modem's LoRa node at SF9 (link.v2, spec/profiles/link/v2.md;
# #988 L5): lora0's router, its SX1262 at 1,758 bit/s with 115 B frames,
# under EU868's 864 s of air a day. Planned as zenohd-rf0.face.toml says,
# with this file as --face-policy.
#
# The transport: at 60 s with 2, the keep-alive interval was 30 s, so one
# frame a minute still left a keep-alive between every two. 480 s with 4
# puts the interval at 120 s, which frames/fast at one every 2 minutes
# replaces: 1,440 keep-alives a day idle, 0.18 false closes a day at 5 %
# loss. (#988 L5 ran 240 s, for frames/link every minute; #991's 3.3 puts
# the readings in one frame every 2.)
#
# Across the face: frames/fast every two minutes, a full record every 15
# minutes (`keyframe_s`, #991's table): all 73 readings in 534 s of air a
# day, lora0's own in 281 s. Its largest frame, 216 B, a delta of all 73
# (link.v1 §2.8), is above the chip's 117 B batch (`frame_over_batch`), and
# its 207 B full record fragments into two frames every 15 minutes. frames/slow and frames/paid are SF12's and SBD's
# (`frame_unlisted`), and the chip has no ARQ (`no_arq`).
profile  = "link.v2"
system   = "h-c2a95e41d7f0"
services = ["lora0"]
binding  = "zm-1.10.2-r1"
catalog  = "e3a529fe"

[transport]
lease_ms             = 480000
keep_alive           = 4
wait_before_close_ms = 480000
sequence             = "16bit"
batch_bytes          = 117          # the chip's 115 B frame and 2 B of stream framing
open_timeout_ms      = 10000
accept_timeout_ms    = 10000
interests_timeout_ms = 10000

[face.lora]
far              = "ground"
attach           = "client"
select           = { link_protocols = ["unixsock-stream"] }
class            = "constrained"
expose           = "link"
interval_s       = 60
max_outage_s     = 3600
link_bps         = 1758
loss_ppm         = 50000
arq              = false
reply_timeout_ms = 15000            # 16 full batches take 8.5 s
horizon_s        = 120

[face.lora.frames]
"modem.v3/frames/fast" = { every_s = 120, keyframe_s = 900 }
