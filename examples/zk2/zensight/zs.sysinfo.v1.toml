# sysinfo, the host metrics producer: the "literal telemetry" case (zensight-common/registry/sysinfo.toml,
# registry 1.9: 136 telemetry + 9 state subjects, 9 procedures, 7 gated entries).
# Key:        zk2/<host-id>/sysinfo/zs.sysinfo.v1/{stream|state|@op}/<resource>
# Example:    zk2/h-3fa9c2d41b7e/sysinfo/zs.sysinfo.v1/stream/memory/usage_percent
# All hosts:  zk2/*/*/zs.sysinfo.v1/stream/**   (the interface chunk, so `sysinfo-2` or a
#             per-computer `sysinfo.c2` is included: r3.2 §0.2, shapes.md row 9)
#
# The service also implements health.v1 (../walkthrough/health.v1.toml), alarms.v1, zs.evidence.v1
# (self only), zs.thresholds.v1 and zs.artifacts.v1 (jobs.v1 + blob.v1, not written in this cut).
# v1's framework rows map there; `sensor`, `introspect` and `describe` are deleted (descriptor,
# bundle). See README "Mapping".
#
# Telemetry is a mechanical transcription (one resource per v1 subject, the v1 description as doc,
# `when` -> optional + gate). Four renames, all to remove template overlap (Gap G1):
#   {cpu}/times/{component}            -> cpus/{cpu}/times/{component}
#   {cpu}/schedstat/run_delay_ns_total -> cpus/{cpu}/schedstat/run_delay_ns_total
#   cpu/{core}/usage                   -> cpu/cores/{core}/usage
#   cpu/{core}/frequency               -> cpu/cores/{core}/frequency
# In v1, `cpu/times/usage` matched both cpu/{core}/usage and cpu/times/{component}, and
# `cpu/times/user` matched {cpu}/times/{component} too. v1 resolved them by most-literal-first
# precedence (rfcs/08-registry.md:33); draft 0 has no precedence rule, so the overlaps have to go.
# QoS: zk2 stream defaults (best_effort, drop, data). v1's `sampled` profile was data_low; restating
# it on 136 resources is what interface-level defaults would avoid (Gap G11). No `history`: RFC 11 §1's
# target posture for telemetry is the baseline tier.
# No resource declares telemetry.kind: v1 sysinfo declares none, and telemetry.v1.Point's tag
# self-describes the value (r3.2 §4.9: "no back-fill").

[interface]
name    = "zs.sysinfo"
major   = 1
minor   = 0
summary = "Host CPU, memory, disk, network, sensors and GPU metrics of one host"
uses    = ["telemetry.v1", "freshness.v1"]

[schemas]
jsonschema = ["schemas/telemetry.v1.json", "schemas/zs.common.json", "schemas/zs.sysinfo.v1.json"]

# --- state ---

[resources."gpu/{card}"]
kind        = "state"
type        = "json:GpuInfo"
params      = { card = "string" }
cardinality = 16
annotations = { "freshness.ttl_s" = 900 }
doc         = "GPU inventory from the kernel's DRM sysfs (#954): vendor, driver, PCI id and product name where the driver publishes them."

[resources.timesync]
kind        = "state"
type        = "json:TimesyncStatus"
annotations = { "freshness.ttl_s" = 900 }
doc         = "The host's own clock discipline (#959): synchronised or not, offset, stratum, reference."

# --- operations (v1 read procedures; selector parameters become request fields) ---

[resources.processes]
kind       = "operation"
request    = "json:ProcessesRequest"
response   = "json:ProcessRecord"
replies    = "many"
idempotent = true
fanout     = "allowed"
doc        = "Top processes, one reply per process (O6). The per-pid detail that is never streamed (the retired process/{rank}/* family, #1070). Fan-out allowed: v1 reads defaulted to allowed."

[resources.latency]
kind       = "operation"
request    = "json:Empty"
response   = "json:LatencyReport"
idempotent = true
fanout     = "allowed"
doc        = "eBPF runqlat/biolatency saturation histograms over the last window. Not gated: a build without eBPF answers available = false, as v1 does."

