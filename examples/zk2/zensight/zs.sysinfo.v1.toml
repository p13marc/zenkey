cardinality = 16
optional    = true
gate        = ["build:nvml", "config:collect.gpu", "capability:nvidia-driver", "capability:ecc"]
doc         = "uncorrected device-memory ECC errors over the lifetime of the device (#954). NVML only. Gate: NVML only, on a card with ECC enabled (#954)"

[resources."gpu/{card}/process/{pid}/vram_bytes"]
kind        = "stream"
type        = "json:telemetry.v1.Point"
params      = { card = "string", pid = "string" }
cardinality = 32
optional    = true
gate        = ["build:nvml", "config:collect.gpu", "capability:nvidia-driver"]
doc         = "VRAM held by one process on this card (#954). NVML only. Capped at 32 rows per card, largest first \u2014 one key per pid per card is otherwise an unbounded family keyed by something that changes every few seconds. Gate: NVML only: per-process attribution has no sysfs equivalent (#954)"
