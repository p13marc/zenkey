params      = { card = "string" }
cardinality = 16
optional    = true
gate        = ["build:nvml", "config:collect.gpu", "capability:nvidia-driver"]
doc         = "percentage of the sample period the GPU MEMORY CONTROLLER was busy (#954). Distinct from VRAM occupancy: this is what separates a memory-bound workload from a compute-bound one. NVML only \u2014 `--features nvml`; no kernel driver exposes it. Gate: NVML only: no kernel driver exposes memory-controller utilisation (#954)"

[resources."gpu/{card}/ecc_volatile_uncorrected"]
kind        = "stream"
type        = "json:telemetry.v1.Point"
params      = { card = "string" }
cardinality = 16
optional    = true
gate        = ["build:nvml", "config:collect.gpu", "capability:nvidia-driver", "capability:ecc"]
doc         = "uncorrected (double-bit) device-memory ECC errors since the driver loaded (#954). UNCORRECTED, not corrected: a corrected error is the hardware working. NVML only, and absent on a card with ECC disabled. Gate: NVML only, on a card with ECC enabled (#954)"

[resources."gpu/{card}/ecc_aggregate_uncorrected"]
kind        = "stream"
type        = "json:telemetry.v1.Point"
