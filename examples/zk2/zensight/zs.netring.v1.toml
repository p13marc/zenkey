# netring, the wire-level flow / L7 / NDR sensor (zensight-common/registry/netring.toml, registry 1.5:
# 75 telemetry, 9 state, 30 procedures, 22 gated entries, 3 blob tiers).
# Key:        zk2/<host-id>/netring/zs.netring.v1/{stream|state|@op}/<resource>
# Example:    zk2/h-3fa9c2d41b7e/netring/zs.netring.v1/stream/flow/red/p95_ms
# All hosts:  zk2/*/*/zs.netring.v1/stream/**  (v1's GUI plan spelled v1/*/telemetry/netring/** and so
#             missed a second instance `netring-2`, zensight/src/view/plan.rs:114; the interface chunk
#             does not have that problem)
#
# What lives elsewhere:
# - the population state (the "budgets"): evidence/names/{ip} (4096) and evidence/device/{device}
#   (4096) are zs.evidence.v1 resources this service exposes; alarms are alarms.v1 (64).
# - packet captures: the files are artifacts. The artifact/{kind} state, artifact/request|cancel|status
#   and the @blob artifact/tree/store tiers become zs.artifacts.v1, a job (jobs.v1) whose Ready state
#   carries a blob.v1 reference (holder system, holder service, hash). That contract is not written in
#   this cut. `captures` below lists the files; a CaptureRecord still carries v1's key prefix
#   (migration debt).
# - thresholds and applied/{topic}: zs.thresholds.v1.
#
# Telemetry is a mechanical transcription. One change removes the only template overlap (Gap G1;
# netring.toml:124 vs :236): capture/{source}/... -> capture/sources/{source}/...,
# so that capture/focus/... and capture/disk/... can never be read as a source named focus or disk.
#
# Listing procedures become many-reply operations (O6). Three of the 15 are written here (flows,
# talkers, captures). The other 12 (tls, matrix, elephant_flows, dns, http, quic, ssh, encrypted_dns,
# ja4h, assets, ipfix, bandwidth) take the same shape: request = their selector parameters,
# response = one record, replies = many, fanout allowed, and their v1 `when` as optional + gate.

[interface]
name    = "zs.netring"
major   = 1
minor   = 0
summary = "Wire-level flow, L7 and NDR telemetry of one host's capture points, and its controls"
uses    = ["telemetry.v1", "freshness.v1"]

[schemas]
jsonschema = ["schemas/telemetry.v1.json", "schemas/zs.common.json", "schemas/zs.netring.v1.json"]

# --- configuration topics: state for the current value, an operation to replace it ---
# v1 served the current value as a read procedure (`<topic>`) and the change as `<topic>/set`, both
# typed TopicStatus/…Config, which v1 never gave a schema (schema.rs:227-231): typed raw JSON here.

[resources.detectors]
kind        = "state"
type        = { raw = "application/json" }
annotations = { "freshness.ttl_s" = 900 }
doc         = "Current detector configuration (runtime detection tuning). v1 TopicStatus, declared-only."

[resources."detectors/set"]
kind       = "operation"
request    = { raw = "application/json" }
response   = "json:Ack"
idempotent = true
fanout     = "allowed"
doc        = "Apply a detector configuration (v1 DetectorConfig, declared-only)."

[resources.capture_filter]
kind        = "state"
type        = { raw = "application/json" }
optional    = true
gate        = "config:capture_focus.enabled"
annotations = { "freshness.ttl_s" = 900 }
doc         = "Current reloadable packet-tier BPF filter."

[resources."capture_filter/set"]
kind       = "operation"
request    = { raw = "application/json" }
response   = "json:Ack"
idempotent = true
fanout     = "allowed"
optional   = true
gate       = "config:capture_focus.enabled"
doc        = "Replace the capture filter (v1 FilterConfig, declared-only)."

[resources.threat_intel]
kind        = "state"
type        = { raw = "application/json" }
optional    = true
gate        = "config:threat"
annotations = { "freshness.ttl_s" = 900 }
doc         = "Current IOC/YARA threat-intel configuration."

[resources."threat_intel/set"]
kind       = "operation"
request    = { raw = "application/json" }
response   = "json:Ack"
idempotent = true
fanout     = "allowed"
optional   = true
gate       = "config:threat"
doc        = "Hot-reload the threat-intel set (v1 ThreatIntelConfig, declared-only)."

[resources.capture_disk]
kind        = "state"
type        = "json:CaptureDiskStatus"
optional    = true
gate        = "config:capture.to_disk.mode"
annotations = { "freshness.ttl_s" = 900 }
doc         = "Capture-to-disk status: mode, ring occupancy, retention, last event."

[resources."capture_disk/set"]
kind       = "operation"
request    = "json:CaptureDiskCommand"
response   = "json:Ack"
idempotent = false
fanout     = "allowed"
optional   = true
gate       = "config:capture.to_disk.mode"
doc        = "capture_now (fire the pre-trigger ring, not idempotent) or set_capture (hot-switch the mode). v1 kept this on fan-out allowed."

# --- listings (many replies) ---

[resources.flows]
kind       = "operation"
request    = "json:Empty"
response   = "json:FlowRecord"
replies    = "many"
idempotent = true
fanout     = "allowed"
doc        = "The flow ring, one flow per reply. Per-flow data never rides a stream (RFC 04 R3)."

[resources.talkers]
kind       = "operation"
request    = "json:TopRequest"
response   = "json:TalkerRecord"
replies    = "many"
idempotent = true
fanout     = "allowed"
optional   = true
gate       = "config:collect.talkers"
doc        = "Per-source rolling rate, top N."

[resources.captures]
kind       = "operation"
request    = "json:Empty"
response   = "json:CaptureRecord"
replies    = "many"
idempotent = true
fanout     = "allowed"
optional   = true
gate       = "config:capture.to_disk.mode"
doc        = "The capture-to-disk file index. Fetching a file goes through zs.artifacts.v1 and blob.v1."

