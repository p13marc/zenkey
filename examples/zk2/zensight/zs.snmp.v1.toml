# One polled SNMP device, as a service of its own: the device-as-service shape (r3.2 §0.2, §3.5).
# v1: snmp.toml (registry 1.14: 127 telemetry, 10 state, 1 events, 14 procedures, 4 gated) put the
#     device in the first subject chunk of one producer: telemetry/snmp/<device>/<metric...>.
# zk2: the poller process hosts one service per configured target, named snmp.<slug(target name)>,
#      plus its own service `snmp` (zs.snmp_poller.v1: targets, discovery, stray traps).
# Key:        zk2/<host-id>/snmp.<device>/zs.snmp.v1/{stream|state|@op}/<resource>
# Example:    zk2/h-3fa9c2d41b7e/snmp.router01/zs.snmp.v1/stream/if/3/in_octets.rate
#             zk2/h-3fa9c2d41b7e/snmp.router01/zs.snmp.v1/stream/metrics/system/sys_uptime
#             zk2/h-3fa9c2d41b7e/snmp.router01/zs.snmp.v1/stream/traps/01jgxqz4yqk8v6txw3m9f2a7cd
# All devices: zk2/*/*/zs.snmp.v1/stream/**  ;  device presence: zk2/*/*/@zk/alive/zs.snmp.v1/**
#
# The instance id is the device's continuity epoch: the poller mints a new instance for the service
# when sysUpTime rewinds, which is what v1 did by cycling device/<device>/alive
# (zensight-sensor-snmp/src/poller.rs:397). Counters reset only across an instance change.
# The name derivation snmp.<slug(name)> is not written down anywhere in r3.2. Target names allow
# '.' and capitals (targets.rs:179), and AlertRef splits on dots (Gap G4).
#
# Each device service also implements alarms.v1 (v1's device alerts move here from the poller's
# single alert family), zs.evidence.v1 (`device/{device}` for its own claim, no `self`),
# zs.thresholds.v1 and views.v1. health.v1 is per device; v1 had a single producer health with
# devices_total/responding.
#
# Telemetry is a mechanical transcription: v1's `{device}/` prefix dropped, the catch-all moved
# under its own literal so it no longer overlaps the 126 typed columns (Gap G1; v1 snmp.toml:15):
#   {device}/{metric...}  ->  metrics/{metric...}
# A metric is published under exactly one of the two: a typed column if it matches one, else the
# catch-all. Trap counters (v1 {device}/trap/<name>) ride metrics/trap/<name>.
# Cardinalities are v1's, which bound the WHOLE poller (up to 64 devices). Per device they are
# lower, and draft 0 has no per-instance value (Gap G2).

[interface]
name    = "zs.snmp"
major   = 1
minor   = 0
summary = "One SNMP-polled device: its metric tree, interface table, traps and outlet control"
uses    = ["telemetry.v1", "freshness.v1"]

[schemas]
jsonschema = ["schemas/telemetry.v1.json", "schemas/zs.common.json", "schemas/zs.snmp.v1.json"]

# --- state ---

[resources.interfaces]
kind        = "state"
type        = "json:InterfaceTable"
history     = true
annotations = { "freshness.ttl_s" = 300 }
doc         = "The joined ifTable/ifXTable (#529): decoded statuses, HC-preferred counters, derived rates. v1: state/snmp/{device}/interfaces, on an AdvancedPublisher cache_only(1) (zensight-sensor-snmp/src/main.rs:222)."

[resources."outlets/last"]
kind        = "state"
type        = "json:OutletStatus"
optional    = true
gate        = "config:actions.enabled"
annotations = { "freshness.ttl_s" = 900 }
doc         = "The most recent outlet outcome. v1's `action` read procedure answered null when nothing had run; as state, 'nothing has run' is simply an absent resource."

[resources."outlets/capability"]
kind        = "state"
type        = "json:OutletCapability"
annotations = { "freshness.ttl_s" = 900 }
doc         = "The outlet-control gate as seen by this device: the switch, the allowlist and the reason nothing is permitted. Published even when actions are off, so 'off' is an answer and not a silence (v1 action/capability)."

# --- occurrence stream (v1's only events-class subject) ---

[resources."traps/{occurrence}"]
kind        = "stream"
type        = "json:EventRecord"
cardinality = 100000
reliability = "reliable"
congestion  = "block"
retention   = "7d"
doc         = """
Translated trap/inform records (#535), one fresh ULID key per notification, published once with a
one-shot put (r3.2 §3.2); a storage keeps the union and a consumer replays with a bounded wildcard GET.
v1: events/snmp/{device}/trap/{id}, QoS reliable + block (QosClass::Event).
v1 declared rate = burst(1000/h), and draft 0 has no field for it. cardinality has no defined
meaning on an {occurrence} template (Gap G6). retention = 7d is new: v1's events storage had no GC
(configs/router-events-storage.json5:95).
Only traps whose sender resolves to this configured target land here. v1 keyed every trap by the
slugged sender IP (zensight-sensor-snmp/src/trap.rs:298-299), so unmatched senders go to the
poller's strays/{sender}/{occurrence} (Gap G15)."""

# --- operations ---

[resources."outlets/{outlet}/cycle"]
kind        = "operation"
request     = "json:Empty"
response    = "json:OutletStatus"
params      = { outlet = "string" }
cardinality = 2048
optional    = true
gate        = "config:actions.enabled"
idempotent  = false
fanout      = "forbidden"
doc         = """
Power-cycle one PDU outlet (#956). v1 action/set took OutletAction {device, outlet, verb} with fanout
allowed; the device is now the service and the outlet is a template parameter, so the request
repeats neither (tcgui gap 1) and each outlet is separately grantable. Fan-out is now FORBIDDEN:
zk2/*/*/zs.snmp.v1/@op/outlets/*/cycle would reach every PDU in the fleet. The allowlist, the
separate write credential and the verified PDU profile are still checked per call. A refusal is
`unavailable` with cause config (v1 error/gated). The caller's identity comes from the O7
call-metadata `actor` and goes to the host audit trail (#957)."""

[resources."outlets/history"]
kind       = "operation"
request    = "json:Empty"
response   = "json:OutletStatus"
replies    = "many"
idempotent = true
fanout     = "allowed"
optional   = true
gate       = "config:actions.enabled"
doc        = "The bounded ring of recent outlet outcomes, one reply each (v1 `actions`)."

