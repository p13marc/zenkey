syntax = "proto3";
package health.v1;

enum Level {
  LEVEL_UNSPECIFIED = 0;
  LEVEL_OK = 1;
  LEVEL_DEGRADED = 2;
  LEVEL_FAILED = 3;
}

message Status {
  Level level = 1;
  string reason = 2;
  uint64 since_ns = 3;
}

message Check {
  Level level = 1;
  string detail = 2;
  uint64 checked_at_ns = 3;
}

message Fault {
  string code = 1;
  Level level = 2;
  string detail = 3;
  uint64 at_ns = 4;
}
