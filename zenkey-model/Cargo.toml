[package]
name = "zenkey-model"
version = "0.21.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
authors.workspace = true
description = "zk2 keys and contracts without a Zenoh session: the key grammar, the contract authoring format, canonical form, fingerprints and bundles"
readme = "README.md"
keywords = ["zenoh", "zk2", "contracts", "keyspace", "schema"]
categories = ["network-programming", "encoding"]
# `CLAUDE.md` is the repository's note for Claude Code, not the crate's.
exclude = ["CLAUDE.md"]

[dependencies]
zenoh-keyexpr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# The TOML 1.0 lint (spec §9.1) reads its event stream; `toml` already
# depends on it.
toml_parser = "1.1.3"
sha2 = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
schemars = { workspace = true }
prost = { workspace = true }
ciborium = { workspace = true }
# telemetry.v1's CBOR reader (§2.6, 0.2): headers as they are, so a bignum
# of any length is an integer and a duplicate map key is seen. Already in
# the tree through ciborium.
ciborium-ll = { workspace = true }
prost-reflect = { workspace = true }
prost-types = "0.14"
protox = "0.9"
# RFC 8785 (JCS): validated nightly against cyberphone's 100M-number corpus
# (#608, the 2026-10-07 library survey). Canonical contracts are restricted
# to ASCII identifiers and integers within ±(2^53−1), so every JCS
# implementation — this one and Python's `rfc8785` — agrees on them.
serde_json_canonicalizer = "0.3"
# Packed records' fixed point (core §7.6): exact decimal arithmetic with no
# bound on a declaration's digits. Already in the tree through der-parser.
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
