name: CI

on:
  push:
    branches: [main, redesign-v0.3]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      # Feature-gated surfaces (schema/decode/decode-protobuf/serde) must
      # stay green too — fixture-tests exercises schemars+decode by default,
      # this covers the rest.
      - run: cargo test -p zenkey --all-features
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # rust-version = 1.88 is declared in every crate; this job makes it true.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --all-features
