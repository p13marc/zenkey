# desired-v2-two/tasking.v2.toml: scenarios-v2.md §11, "As v1's, with
# tasking.v2 and worker.v2": tasking.v2 with a second desired resource,
# plans, declared as the first is, as v1's §11 adds one to tasking.v1. A
# worker's role naming both names two documents (desired.v1 §2.1, §2.3:
# two_documents). zk2py's own (round 121); it must load with no finding.
[interface]
name  = "tasking"
major = 2
minor = 0
uses  = ["desired.v2", "freshness.v2"]

[schemas]
jsonschema = ["../desired-v2/tasking.json"]

[resources."tasks/{system}/{service}"]
kind        = "state"
type        = "json:Task"
params      = { system = "string", service = "string" }
cardinality = 16
annotations = { "desired.target_param" = ["system", "service"], "freshness.ttl_s" = 0 }

[resources."plans/{system}/{service}"]
kind        = "state"
type        = "json:Task"
params      = { system = "string", service = "string" }
cardinality = 16
annotations = { "desired.target_param" = ["system", "service"], "freshness.ttl_s" = 0 }
