# freshness.v2 scenarios-v2.md §7's contract: beacon.v2 with link.exposure = "link" on
# status and level, so it uses link.v1 too (E020), as §7's setup reads them (F-443).
# It must load with no finding at all.
[interface]
name  = "beacon"
major = 2
minor = 0
uses  = ["freshness.v2", "link.v1"]

[resources.status]                         # one member: a heartbeat every 0.95 s
kind        = "state"
type        = { raw = "text/plain" }
annotations = { "freshness.ttl_s" = 2, "link.exposure" = "link" }

[resources."peer/{peer}"]                  # templated, best_effort under loss
kind        = "state"
type        = { raw = "text/plain" }
params      = { peer = "string" }
cardinality = 8
reliability = "best_effort"
congestion  = "drop"
annotations = { "freshness.ttl_s" = 4 }

[resources.route]                          # behind a capability
kind        = "state"
type        = { raw = "text/plain" }
optional    = true
gate        = ["capability:routing"]
annotations = { "freshness.ttl_s" = 4 }

[resources.intent]                         # never stale: no collection
kind        = "state"
type        = { raw = "text/plain" }
annotations = { "freshness.ttl_s" = 0 }

[resources.note]                           # no horizon: no collection
kind = "state"
type = { raw = "text/plain" }

[resources.level]                          # a stream, ttl 1 s
kind        = "stream"
type        = { raw = "text/plain" }
annotations = { "freshness.ttl_s" = 1, "link.exposure" = "link" }
