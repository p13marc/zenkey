# freshness.v2's scenario contract, as spec/profiles/freshness/scenarios-v2.md
# "Conventions" writes it ("The contract"), copied from that text. zk2py's
# freshness.v2 scenarios use it. It must load with no finding at all.
[interface]
name  = "beacon"
major = 2
minor = 0
uses  = ["freshness.v2"]

[resources.status]                         # one member: a heartbeat every 0.95 s
kind        = "state"
type        = { raw = "text/plain" }
annotations = { "freshness.ttl_s" = 2 }

[resources."peer/{peer}"]                  # templated, best_effort under loss
kind        = "state"
type        = { raw = "text/plain" }
params      = { peer = "string" }
cardinality = 8
reliability = "best_effort"
congestion  = "drop"
annotations = { "freshness.ttl_s" = 4 }

[resources.route]                          # behind a capability
kind        = "state"
type        = { raw = "text/plain" }
optional    = true
gate        = ["capability:routing"]
annotations = { "freshness.ttl_s" = 4 }

[resources.intent]                         # never stale: no collection
kind        = "state"
type        = { raw = "text/plain" }
annotations = { "freshness.ttl_s" = 0 }

[resources.note]                           # no horizon: no collection
kind = "state"
type = { raw = "text/plain" }

[resources.level]                          # a stream, ttl 1 s
kind        = "stream"
type        = { raw = "text/plain" }
annotations = { "freshness.ttl_s" = 1 }
