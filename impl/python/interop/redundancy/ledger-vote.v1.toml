# ledger.v1.toml: ledger.v1 with an election outside the vocabulary (scenarios.md §11 step 2)
# (spec/profiles/redundancy/scenarios.md, "The contracts", verbatim)
[interface]
name  = "ledger"
major = 1
minor = 0
uses  = ["redundancy.v1"]

[defaults]
annotations = { "redundancy.election" = "vote" }

[resources.balance]
kind = "state"
type = { raw = "text/plain" }

[resources.entries]
kind = "stream"
type = { raw = "text/plain" }

[resources.append]
kind     = "operation"
request  = { raw = "text/plain" }
response = { raw = "text/plain" }
