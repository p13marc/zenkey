# zk2py_worker4.v1.toml: a worker whose role names both of zk2py_tasking2's
# desired resources (desired.v1 §2.17, F-218). zk2py's own, for its tool's
# shapes; it must load with no finding at all.
[interface]
name  = "zk2py_worker4"
major = 1
minor = 0
uses  = ["desired.v1"]

[schemas]
jsonschema = ["../../../../spec/profiles/desired/desired.v1.json"]

[resources."desired/task"]
kind = "state"
type = "json:desired.v1.Report"

[requires.task]
interface = "zk2py_tasking2.v1"
resources = ["tasks/{system}/{service}", "plans/{system}/{service}"]
optional  = true
