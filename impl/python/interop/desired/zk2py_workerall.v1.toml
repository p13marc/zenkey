# zk2py_workerall.v1.toml: a worker whose role names no resource, so every
# resource of tasking.v1 (core §3.1): from the target alone no template is
# named, and no candidate (desired.v1 §2.17, 0.5). zk2py's own, for its
# tool's shapes; it must load with no finding at all.
[interface]
name  = "zk2py_workerall"
major = 1
minor = 0
uses  = ["desired.v1"]

[schemas]
jsonschema = ["../../../../spec/profiles/desired/desired.v1.json"]

[resources."desired/task"]
kind = "state"
type = "json:desired.v1.Report"

[requires.task]
interface = "tasking.v1"
optional  = true
