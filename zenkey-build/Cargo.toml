[package]
name = "zenkey-build"
version = "0.22.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
authors.workspace = true
description = "zk2 codegen: typed servers, consumers and clients from zk2 contracts, from your build script"
readme = "README.md"
keywords = ["zenoh", "zk2", "codegen", "contracts", "build"]
categories = ["development-tools::build-utils", "network-programming"]
exclude = ["CLAUDE.md"]

[dependencies]
zenkey-model = { path = "../zenkey-model", version = "0.22.0" }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
heck = "0.5"
prost = { workspace = true }
prost-types = "0.14"
prost-build = "0.14.4"
typify = { version = "0.8", default-features = false }
schemars08 = { package = "schemars", version = "0.8.22" }
schemars = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
