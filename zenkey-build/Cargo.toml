[package]
name = "zenkey-build"
description = "Registry codegen for the zenkey keyspace-v2 convention: lint registry TOMLs (RFC 08 §5) and generate typed subject/procedure builders from your build script"
readme = "README.md"
keywords = ["zenoh", "keyspace", "codegen", "semantic-convention"]
categories = ["development-tools::build-utils", "network-programming"]
rust-version.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Registry-as-document exporters (#208). Off by default: this crate runs in
# consumers' build scripts, and the promise below about a light dependency
# graph is the reason `serde_json` is not unconditional.
export = ["dep:serde_json"]

# docs.rs builds once per published version and cannot be re-run for it, so
# the feature-gated surface has to be right *before* the publish, not after
# (#325). `all-features` documents every axis; the two rustdoc flags annotate
# each item with the feature that gates it, which is the half a reader
# actually needs — otherwise a `#[cfg(feature = "blob")]` item reads as
# unconditionally available.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "-Zunstable-options", "--generate-link-to-definition"]

[dependencies]
# default-features = false: codegen needs only the chunk rules, never the
# zenoh stack — a consumer's build-dependencies stay light.
zenkey = { version = "0.8.0", path = "../zenkey", default-features = false }
thiserror = { workspace = true }
serde_json = { workspace = true, optional = true }
toml = "1"
