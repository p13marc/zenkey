# core §7.1, §9.2 E044: a packed type where no CH carries its tag. An
# explicit stream's type and an attachment: one per reference. A packed
# type on an explicit state is fine, and so is an operation's
# (ok-packed-operation).
[interface]
name = "seed"
major = 1
minor = 0

[schemas]
packed = ["schemas/packed/sensor.json"]

[resources.raw_video]
kind = "stream"
explicit = true
type = "packed:Sensor"

[resources.annotated]
kind = "stream"
type = { raw = "text/plain" }
attachment = "packed:Status"

[resources.held]
kind = "state"
explicit = true
type = "packed:Status"
