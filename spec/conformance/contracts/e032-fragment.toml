# A `$ref` fragment is a JSON Pointer, used as written (§9.4): `#here` is
# not one, and `%20` is not decoded (E032 each). A `:` in the pointer is
# not a scheme, `~1` is `/`, and a `$ref` inside data (`const`,
# `examples`) is not a `$ref`.
[interface]
name = "seed"
major = 1
minor = 0

[schemas]
jsonschema = ["schemas/refs-fragment.json"]
