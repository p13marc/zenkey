# TOML 1.0 integers are 64-bit signed: 2^63 is not TOML 1.0 (§9.1), even
# for a reader that holds it, so it is E000 and never reaches E028.
[interface]
name = "seed"
major = 1
minor = 0
uses = ["freshness.v1"]

[resources.a]
kind = "stream"
type = { raw = "text/plain" }
annotations = { "freshness.ttl_s" = 9223372036854775808 }
