# core §7.6, §9.2 E051, cascade 7: a packed type whose layout tag is 0, the
# tag a record of any other kind carries (§7.5). Per type, whether a
# resource names it or not. Zero, an int from 0 to 127 then a marker, has
# the tag 0; Unnamed is Zero's form under other names, which the form
# leaves out, so it has the tag 0 too, and no resource names it. Fine is
# Zero with a maximum of 100, the tag 11. Two E051.
[interface]
name = "seed"
major = 1
minor = 0

[schemas]
packed = ["schemas/packed/tag.json"]

[resources.zero]
kind = "stream"
type = "packed:Zero"

[resources.fine]
kind = "stream"
type = "packed:Fine"
