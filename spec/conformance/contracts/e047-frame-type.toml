# core §7.7, §9.2 E047: a frame resource's type. A raw type is not packed,
# and a packed type with an extension marker could grow, which a delta
# record's bitmap cannot: one each.
[interface]
name  = "seed"
major = 1
minor = 0

[schemas]
packed = ["schemas/packed/frames.json"]

[resources."frames/text"]
kind  = "stream"
type  = { raw = "text/plain" }
frame = { records = 1 }

[resources."frames/grown"]
kind  = "stream"
type  = "packed:frames#Grown"
frame = { records = 1 }
