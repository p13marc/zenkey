# JCS writes an integral float below 10^21 as an integer, so 1e16 has the
# bytes of an integer beyond 2^53−1: one E028 per value (§9.5).
[interface]
name = "seed"
major = 1
minor = 0
uses = ["freshness.v1"]

[resources.a]
kind = "stream"
type = { raw = "text/plain" }
annotations = { "freshness.ttl_s" = 1e16 }

[resources.b]
kind = "stream"
type = { raw = "text/plain" }
annotations = { "freshness.ttl_s" = -9007199254740992.0 }
