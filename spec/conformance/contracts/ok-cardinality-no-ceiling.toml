# A templated resource whose population no contract can fix, such as an
# archive's (§4.4), still declares a cardinality (E013). By convention it
# declares 4294967295 (2^32-1), which reads "no ceiling" (§2.2). It is a
# positive integer like any other, so the contract is valid.
[interface]
name = "seed"
major = 1
minor = 0

[resources."{origin...}"]
kind = "state"
explicit = true
type = { raw = "application/octet-stream" }
params = { origin = "path" }
cardinality = 4294967295
