# core §9.4, §9.2 E024: `packed:Sensor` is defined by two listed packed
# files; `packed:other#Sensor` resolves. A JSON Schema file and a packed file
# may share a stem: they are two kinds.
[interface]
name = "seed"
major = 1
minor = 0

[schemas]
jsonschema = ["schemas/packed/json/other.json"]
packed = ["schemas/packed/sensor.json", "schemas/packed/other.json"]

[resources.a]
kind = "stream"
type = "packed:Sensor"

[resources.b]
kind = "stream"
type = "packed:other#Sensor"

[resources.c]
kind = "stream"
type = "json:other#Sensor"
