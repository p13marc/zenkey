[interface]
name = "seed"
major = 1
minor = 0

[resources."streams/{stream}"]
kind        = "stream"
type        = { raw = "text/plain" }
params      = { stream = "string" }
cardinality = 8
epoch       = "stream"

[resources."containers/{container}"]
kind        = "state"
type        = { raw = "text/plain" }
params      = { container = "string" }
cardinality = 8
epoch       = "container"
