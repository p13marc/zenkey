# core §7.6, §9.2 E038, cascade 7: once per object at fault. The top level
# (an unknown member); a type whose name is not a type name, which defines
# no type, and nothing in whose record is linted (its field's `type`
# names no field type, E043 elsewhere); a record with an unknown member;
# and in `Fine`, eight items: no `name`, a member `int` does not take, a
# name that is not a field name, a fixed bound given as a number, an
# unknown reserved name, an item that is neither a field nor the marker,
# `optional` not a boolean, and an int bound written `5.0`, a float.
[interface]
name = "seed"
major = 1
minor = 0

[schemas]
packed = ["schemas/packed/shape.json"]

[resources.a]
kind = "stream"
type = "packed:Fine"
