# core §10 point 2: W105 reads the table of the major the contract uses.
# `telemetry.v1`'s has no `series`, so the frame's `telemetry.series` draws
# W105; `ok-telemetry-v2-series` is the same contract under `telemetry.v2`,
# whose table adds it, and draws none.
[interface]
name  = "seed"
major = 1
minor = 0
uses  = ["telemetry.v1"]

[schemas]
packed = ["schemas/packed/frames.json"]

[resources."frames/link"]
kind  = "stream"
type  = "packed:frames#Link"
frame = { records = 1 }

[resources."frames/link".annotations."telemetry.series"]
dropped     = { kind = "counter", unit = "1" }
queue_depth = { kind = "gauge", unit = "1" }
