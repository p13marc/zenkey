# Floats in annotations (§9.5): an integral one has the canonical bytes of
# the integer (60.0 is 60), and from 10^21 JCS writes an exponent (1e+21).
[interface]
name = "seed"
major = 1
minor = 0
uses = ["freshness.v1", "telemetry.v1"]

[resources.a]
kind = "stream"
type = { raw = "text/plain" }
annotations = { "freshness.ttl_s" = 60.0, "telemetry.buckets" = [0.5, 1e21, -0.0] }
