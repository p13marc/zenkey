// History, read by no rule. An earlier version of the zk2 core had a
// protobuf operation answer a failed call with `reply_err`, this message as
// the payload, and the Zenoh encoding `application/protobuf` with the schema
// suffix `zk2.core.v1.Error`. A failed call is now answered in core §7.5's
// error form (spec core.md §5.2), and a reply error under this encoding is
// the transport's.
syntax = "proto3";

package zk2.core.v1;

message Error {
  // invalid_request | not_found | unavailable | forbidden | fanout_forbidden
  // | busy | internal | app
  string code = 1;
  // For a human. Tools never parse it.
  string message = 2;
  // With `unavailable` only, and then required: build | config | capability.
  optional string cause = 3;
  // With `app` only: the operation's declared `error` message, encoded.
  optional bytes detail = 4;
}
