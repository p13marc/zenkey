[package]
name = "zenwatch"
version = "0.5.0"
# Publication policy (docs/redesign-2026-07.md §15, as zenctl and zengui):
# a Forgejo release binary, never a crates.io crate.
publish = false
edition.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Notifier for a zk2 Zenoh deployment — zenctl watchdog's closed vocabulary plus instance-gone on the live presence projection and the liveliness dead-man's switch, routed to ntfy, SMTP, a webhook or a command (#388)"
readme = "README.md"
license = "Apache-2.0"

[[bin]]
name = "zenwatch"
path = "src/main.rs"

[dependencies]
# The read side, on zk2 (#614, FL2): the in-tree engine (rules, the live
# presence projection, contracts, the doctor) and the session-free model
# (the key grammar, the slug a rule's id is spelled with).
zenkey-fleet = { path = "../zenkey-fleet" }
zenkey-model = { path = "../zenkey-model" }
# The write side, still v1's until FL3 (#614): `publish.rs` brings the
# daemon up as a v1 producer (`schemars`: its served `describe` derives the
# three registered types' schemas from the structs that publish them, RFC 08
# §7). Renamed so no read-side line can reach them; FL3 deletes both, and
# the build dependency below.
zenkey-v1 = { package = "zenkey", version = "=0.11.1", features = ["schemars"] }
zenkey-fleet-v1 = { package = "zenkey-fleet", version = "=0.18.0" }
zenkey-explorer-config = { workspace = true }
zenoh = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
json5 = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The sinks. See the workspace manifest for the TLS-provider decision.
reqwest = { workspace = true }
rustls = { workspace = true }
lettre = { workspace = true }

[build-dependencies]
# The daemon's own v1 registry (RFC 08 §5): `health`, `firing/{rule_id}`,
# `doctor` and the two procedures every producer serves — v1's write side,
# until FL3 replaces it with a zk2 contract (#614).
zenkey-build-v1 = { package = "zenkey-build", version = "=0.11.1" }

[dev-dependencies]
# The zk2 runtime: the live tests' owners are real services, brought up and
# stopped with its own `ServiceBuilder` (#614, FL2).
zenkey = { path = "../zenkey" }
trycmd = { workspace = true }
snapbox = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Crate-local, like zenctl's: the workspace table cannot express a target.
libc = "0.2"
