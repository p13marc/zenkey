[package]
name = "zenwatch"
version = "0.5.0"
# Publication policy (docs/redesign-2026-07.md §15, as zenctl and zengui):
# a Forgejo release binary, never a crates.io crate.
publish = false
edition.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Notifier for a zk2 Zenoh deployment — zenctl watchdog's closed vocabulary plus instance-gone on the live presence projection and the liveliness dead-man's switch, routed to ntfy, SMTP, a webhook or a command (#388)"
readme = "README.md"
license = "Apache-2.0"

[[bin]]
name = "zenwatch"
path = "src/main.rs"

[dependencies]
# The read side, on zk2 (#614, FL2): the in-tree engine (rules, the live
# presence projection, contracts, the doctor) and the session-free model
# (the key grammar, the slug a rule's id is spelled with).
zenkey-fleet = { path = "../zenkey-fleet" }
zenkey-model = { path = "../zenkey-model" }
# The write side, on zk2 (#614, FL3): the daemon is a zk2 service, with its
# own `zenwatch.v1` contract (`contracts/`) and `health.v1`, brought up
# through the runtime's `ServiceBuilder`. The build script generates the
# typed server the contract describes.
zenkey = { path = "../zenkey" }
zenkey-explorer-config = { workspace = true }
zenoh = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# zenwatch.v1 is Rust-first: its payload types are this crate's structs, and
# the committed schema is kept in step with what they derive (`check_schema`).
schemars = { workspace = true }
json5 = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The sinks. See the workspace manifest for the TLS-provider decision.
reqwest = { workspace = true }
rustls = { workspace = true }
lettre = { workspace = true }

[build-dependencies]
# zk2's codegen (#611): the lints and the history's compatibility gate on
# zenwatch's own contract, its bundle embedded, and the typed `zenwatch_v1`
# module, its JSON Schema types bound to this crate's structs.
zenkey-build = { path = "../zenkey-build" }

[dev-dependencies]
# `check_schema`: each Rust-first type against the schema committed for it.
zenkey-build = { path = "../zenkey-build" }
trycmd = { workspace = true }
snapbox = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Crate-local, like zenctl's: the workspace table cannot express a target.
libc = "0.2"
