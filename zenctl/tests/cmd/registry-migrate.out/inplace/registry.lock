# registry.lock — the RFC 08 §3.1 compatibility snapshot.
# Regenerate with `zenctl registry lock <dir>` after additive edits;
# an incompatible edit (changed type/class/kind/shape on an existing
# path) is refused — retire through [[deprecated]] and add a sibling
# instead (RFC 08 §3). A subject line's optional sixth column is its
# declared `kind` (RFC 08 §2, v1.32): adding one is additive,
# changing or removing one is incompatible. An `error` line pins a
# declared error name (RFC 08 §2, v1.40), which retires like a subject.
# A `when-subject` / `when-procedure` line pins an entry's gate (v1.35):
# a gate is not a shape, so its every change is stale, never incompatible.
# An `exposure-*` or `sensitive-procedure` line pins a marker (v1.43),
# stale on every change for the same reason.
subject	demo	load	telemetry	Load
subject	demo	status	state	Status
