# A zk2 deployment's storages: two volumes, four storages by selector. The
# strip prefixes are derived by `zenctl storage gen`; a lifespan is the
# file's, or zenoh's default. v1's class table left at FJ9 (#612).
base = "fleet-a"

[volumes.fs]
plugin = "fs"

[volumes.influxdb]
plugin = "influxdb"
url = "http://localhost:8086"

[storages.events]
selector = "zk2/*/*/*/events/**"
volume = "fs"
replication = true
complete = true
params = { dir = "events" }

[storages.links]
selector = "zk2/*/*/*/events/link/**"
volume = "fs"
params = { dir = "links" }
gc_lifespan_s = 3600

[storages.timeseries]
selector = "zk2/*/*/*/stream/**"
volume = "influxdb"
params = { db = "streams" }

[storages.plant]
selector = "plant/**"
volume = "influxdb"
params = { db = "plant" }
