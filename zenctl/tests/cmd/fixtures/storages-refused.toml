# Three storages, each refused for a different reason: replication on an
# all-mode volume (RFC 09 §2.2), a volume nobody declared, and a selector
# that is not a key expression.
base = "fleet-a"

[volumes.influxdb]
plugin = "influxdb"

[storages.history]
selector = "zk2/*/*/*/stream/**"
volume = "influxdb"
replication = true

[storages.stray]
selector = "zk2/*/*/*/events/**"
volume = "rocks"

[storages.typo]
selector = "zk2//events"
volume = "influxdb"
