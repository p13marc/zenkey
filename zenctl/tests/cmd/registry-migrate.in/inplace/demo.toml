# Subject registry: demo — the migrate case's fixture (#374).
#
# This header is the file's, and stays the file's.

[registry]
version = "0.1"
app = "demo"
convention = 1
reason = "a column no build reads"

[producer]
name = "demo"
description = "a demo producer"

# The status document: the block above a table is its node's.
[[subject]]
path = "status"
class = "state"
type = "Status"
ttl_s = 60
since = "0.1"
# a comment above a key is hoisted
description = "up"  # and so is one after it

[[subject]]
path = "load"
class = "telemetry"
type = "Load"
since = "0.1"
description = "load"

# after the last entry
