[package]
name = "zenctl"
version = "0.4.0"
# Publication policy (docs/redesign-2026-07.md §15): zenctl ships as a
# GitHub release binary / `cargo install --git`; new versions are NOT
# published to crates.io (0.1.x stays there, un-yanked, pointing here).
publish = false
edition.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bus explorer for the keyspace-v2 Zenoh convention — the busctl/d-feet equivalent (RFC 08 §6)"
readme = "README.md"
keywords = ["zenoh", "keyspace", "cli", "introspection"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.97"
license = "Apache-2.0"

[[bin]]
name = "zenctl"
path = "src/main.rs"

[dependencies]
zenkey = { workspace = true }
# The codec matrix is enabled in the *binary*, not the library (issues #97,
# #98): the dynamic protobuf decoder existed since v1.5 and was compiled out
# of every shipped explorer, so a protobuf subject rendered as a hex sniff and
# could not be published to at all. `cdr` joins it for DDS / ROS 2 traffic.
# `blob` is the same posture for the @blob transport (#58): the library stays
# free of the hashing stack, and the explorer that has to fetch bytes pays.
zenkey-fleet = { workspace = true, features = ["blob", "decode-protobuf", "decode-cdr", "validate-json"] }
# A *runtime* dependency on the codegen crate, on purpose (issue #50):
# `registry lint` must run the same RFC 08 §5 lints a consumer's build.rs runs,
# and re-implementing them here would be a second set that could disagree with
# the first. It brings no zenoh stack — zenkey-build depends on zenkey with
# default features off.
# `export` adds the AsyncAPI document exporter (#208), which moved here from
# this crate — registry in, document out is codegen's shape, not a CLI's.
zenkey-build = { workspace = true, features = ["export"] }

zenoh = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
ciborium = { workspace = true }
tracing-subscriber = { workspace = true }
anstyle = { workspace = true }
anstyle-query = { workspace = true }

[dev-dependencies]
# #201: 9,272 LOC with no `tests/` directory at all. The corpus lands *before*
# the renderer rewrite (#198/#199) rather than after it, so it guards the
# refactor instead of being written to match whatever the refactor produced.
trycmd = { workspace = true }
# `snapbox` comes with trycmd and is what `str![[...]]` inline snapshots use.
# Named explicitly rather than leaned on transitively, since the render tests
# depend on it directly.
snapbox = { workspace = true }
# `strip_str`, for the acceptance test and nothing else.
anstream = { workspace = true }
# The report values `zenkey-fleet/tests/report_contract.rs` is written against
# — the same ones, so the wire corpus and the render corpus cannot disagree
# about what a report is (#201).
zenkey-report-fixtures = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Crate-local rather than workspace-declared, and the only such dep here: the
# workspace dependency table cannot express `[target.'cfg(unix)']`.
libc = "0.2"
