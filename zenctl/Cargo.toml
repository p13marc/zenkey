[package]
name = "zenctl"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bus explorer for the keyspace-v2 Zenoh convention — the busctl/d-feet equivalent (RFC 08 §6)"
readme = "README.md"
keywords = ["zenoh", "keyspace", "cli", "introspection"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.88"
license = "Apache-2.0"

[[bin]]
name = "zenctl"
path = "src/main.rs"

[dependencies]
zenkey = { workspace = true }

zenoh = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
ciborium = { workspace = true }
tracing-subscriber = { workspace = true }
