[package]
name = "zenctl"
version = "0.12.0"
# Publication policy (docs/redesign-2026-07.md §15): zenctl ships as a
# GitHub release binary / `cargo install --git`; new versions are NOT
# published to crates.io (0.1.x stays there, un-yanked, pointing here).
publish = false
edition.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bus explorer for the keyspace-v2 Zenoh convention — the busctl/d-feet equivalent (RFC 08 §6)"
readme = "README.md"
keywords = ["zenoh", "keyspace", "cli", "introspection"]
categories = ["command-line-utilities", "network-programming"]
rust-version.workspace = true
license = "Apache-2.0"

[[bin]]
name = "zenctl"
path = "src/main.rs"

[dependencies]
# The engine, by path while it is ported (#612). No v1 `zenkey` since FJ9:
# what zenctl needs of the runtime it reaches through the engine.
zenkey-fleet = { path = "../zenkey-fleet" }
zenkey-explorer-config = { workspace = true }
# zk2's session-free half (#612, FJ4): the key grammar, the contract
# authoring format, bundles and the compatibility classifier `compat` runs —
# the same one the contract CI binary and the codegen's history gate run.
zenkey-model = { path = "../zenkey-model" }

zenoh = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
ciborium = { workspace = true }
tracing-subscriber = { workspace = true }
anstyle = { workspace = true }
anstyle-query = { workspace = true }

[dev-dependencies]
# #201: 9,272 LOC with no `tests/` directory at all. The corpus lands *before*
# the renderer rewrite (#198/#199) rather than after it, so it guards the
# refactor instead of being written to match whatever the refactor produced.
trycmd = { workspace = true }
# `snapbox` comes with trycmd and is what `str![[...]]` inline snapshots use.
# Named explicitly rather than leaned on transitively, since the render tests
# depend on it directly.
snapbox = { workspace = true }
# `strip_str`, for the acceptance test and nothing else.
anstream = { workspace = true }
# The report values `zenkey-fleet/tests/report_contract.rs` is written against
# — the same ones, so the wire corpus and the render corpus cannot disagree
# about what a report is (#201).
zenkey-report-fixtures = { workspace = true }
# The zk2 runtime, to bring services up in `tests/live_zk2.rs` with its own
# `ServiceBuilder` (#612, FJ4).
zenkey = { path = "../zenkey" }

[target.'cfg(unix)'.dependencies]
# Crate-local rather than workspace-declared, and the only such dep here: the
# workspace dependency table cannot express `[target.'cfg(unix)']`.
libc = "0.2"
