# The prose lane (#420). `ci.yml` ignores '**.md' and 'docs/**' on purpose —
# a prose change must not rebuild the workspace — but a gate whose inputs
# are markdown would then run on every push except the ones it exists for:
# PR #419 (five files, all under v1's rfcs/) merged with zero CI statuses.
# This workflow is the inverse trigger: it runs when and only when prose
# changes, and it runs the gates whose inputs are prose. The expensive jobs
# stay where they are. v1's RFC set and its status gate left main with #925;
# the `v1` branch keeps both, and this file's copy there.
name: Docs
on:
  push:
    branches: [main, v1]
    paths: ['**.md', 'docs/**', 'scripts/check-spec-status.sh', 'scripts/check-spec-prose.py', 'spec/.prose-baseline.json', 'scripts/gen-rules-index.py', 'scripts/fixtures/rules-index/**']
  pull_request:
    paths: ['**.md', 'docs/**', 'scripts/check-spec-status.sh', 'scripts/check-spec-prose.py', 'spec/.prose-baseline.json', 'scripts/gen-rules-index.py', 'scripts/fixtures/rules-index/**']
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-status:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      # The zk2 spec's version and inventory, stated once (#922): core.md's
      # header names spec/CHANGELOG.md's newest amendment, observer.md's
      # header spec/observer-CHANGELOG.md's newest text (#925), README.md and
      # spec/README.md state neither version, and spec/profiles/README.md's
      # index lists every profile text there is.
      - run: ./scripts/check-spec-status.sh
      # The spec's prose, held to a ratchet (#935): each text's mean words
      # per sentence, its sentences over 50 words (35 under docs/guide/) and
      # its inline history tags never rise above spec/.prose-baseline.json.
      - run: python3 scripts/check-spec-prose.py
      # The rule index (#926): spec/RULES.md is what gen-rules-index.py
      # generates from core.md and observer.md, and the script reads its
      # fixture text as the fixture's expect.json says.
      - run: python3 scripts/gen-rules-index.py --check
      - run: python3 scripts/gen-rules-index.py --self-test
