name: CI
# `impl/python/**` is zk2py (#609), which nothing here builds or reads: a
# Python round is checked by python.yml instead of a full Rust run.
on:
  push:
    branches: [main, v1]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*', 'impl/python/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*', 'impl/python/**']
  # manual re-run path (flaky job, runner was offline, cache experiments)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # shared compiler cache: sccache (mounted from the runner VM) -> garage S3
  # on vm-runner-01; S3 endpoint+credentials come from the runner's env_file
  RUSTC_WRAPPER: /srv/cache/bin/sccache
  CARGO_INCREMENTAL: "0"
  # Cap build parallelism: cargo otherwise defaults to nproc (6 on
  # vm-runner-01) per job, against a lane capacity of 2.
  CARGO_BUILD_JOBS: "2"
  # Panics keep file:line, the build drops full DWARF. With it, two
  # concurrent `test` jobs filled the runner's /srv/cache (runs 1162/1164,
  # 2026-10-19). vm-dev builds with the same setting.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      # The gutter gate (#195): a multi-line string that lost its trailing `\`
      # keeps the source indentation *in the string*, so the user reads a
      # sentence with a hole in it. Seven shipped before anything looked.
      - run: python3 scripts/check-prose.py zenctl/src zenkey-fleet/src zengui/src zenkey-explorer-config/src zenwatch/src
      # One report, three renderings, and exactly one place that decides which
      # (#198). Cheap, and it runs before the compiler like the gutter gate.
      - run: ./scripts/check-render-seam.sh
      # The dispatch dispatches (#209): `lib.rs` names no engine, and `run()`
      # stays under the 600 lines the issue drew the line at.
      - run: ./scripts/check-dispatch.sh
      # The update thread does not touch the disk (#255): a handler that
      # needs the filesystem needs a services:: function returning a Task and
      # a message for the result to land on.
      - run: ./scripts/check-fs-seam.sh
      # One seam for liveliness subscribers (#830): each one marks its
      # session, and the runtime refuses a presence read beside it.
      - run: ./scripts/check-liveliness-seam.sh
      # RFC status lines agree with the CHANGELOG's Amends ledger (v1.25 S6).
      # Doc-only pushes are `paths-ignore`d here and run this same gate on
      # the Docs lane (docs.yml, #420); it stays here too so a code push that
      # also touches an RFC runs it in the same status set.
      - run: ./scripts/check-rfc-status.sh
      # The zk2 spec's version and inventory, stated once (#922): core.md's
      # header names the CHANGELOG's newest amendment, README.md and
      # spec/README.md state no core version, and the profiles index lists
      # every spec/profiles/<name>/v<N>.md. Run here and on the Docs lane,
      # as check-rfc-status.sh is.
      - run: ./scripts/check-spec-status.sh

  # The type scale, by role (#191): `.size(` outside `kit/`/`tokens.rs`
  # must take a `font::` constant, and a bare `text(` must not appear outside
  # `kit/`; `.font(` names a bundled `face::` (#533). The colour rule beside
  # it is check-color.sh (#534) — claimed here since day one, gated since.
  type-scale:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - run: ./scripts/check-type-scale.sh
      # Interactive elements route through kit:: (#193): the button statuses
      # and the focus ring are handled once, and a raw widget constructor at
      # a call site is exactly the per-site styling that rule closed.
      - run: ./scripts/check-interactive.sh
      # The spacing grid (#192): every .padding()/.spacing() takes the scale
      # (sp.* in a dock, space::* in the chrome) — density can only multiply
      # what goes through the tokens.
      - run: ./scripts/check-spacing.sh
      # Colour comes from the theme (#534): no colour is constructed outside
      # view/theme.rs, and no view reaches past `colors(theme).<role>()` into
      # iced's palette — which is what lets both themes be contrast-tested
      # in one place.
      - run: ./scripts/check-color.sh

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    # zengui's pane tests build a real iced renderer per test, which probes
    # wgpu across every backend and every Vulkan ICD present. Unconstrained on
    # a headless runner that segfaults under the concurrency of a workspace
    # test run: measured at 12/128 runs of 8 concurrent copies of the panes
    # binary, against 0/224 with any constraint applied — `gl`, `vulkan`, a
    # single ICD, or --test-threads=1 all fixed it. The fault is upstream in
    # wgpu/mesa adapter enumeration; naming one backend is a mitigation, not a
    # repair, and the 42 pane tests stay enabled because they are how the
    # honesty surfaces are pinned (zenkey #229).
    env:
      WGPU_BACKEND: gl
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      # The newest nextest this install-action release has a manifest for.
      - uses: https://github.com/taiki-e/install-action@v2.87.7
        with:
          tool: cargo-nextest@0.9.143
      - run: cargo build --workspace --all-targets --locked
      # One process per test, across binaries at once: the suite is mostly
      # waiting on real clocks, and `cargo test` ran its binaries one after
      # another, so the waits added up (.config/nextest.toml).
      - run: cargo nextest run --workspace --locked --profile ci
      - run: cargo test --workspace --doc --locked
      # Benches are a gate, not decoration: the baseline in
      # docs/bench-baseline.md is only worth reading if the code behind it
      # still compiles. `--all-targets` above already compiles and links
      # them (harness = false benches included) on every run, PRs too. The
      # release-profile build is a second full tree in the same workspace,
      # so it runs on pushes and manual dispatch only.
      - if: github.event_name != 'pull_request'
        run: cargo bench --workspace --no-run --locked

  # `clippy`/`msrv` use --all-features and `test` uses the defaults, so
  # nothing else builds a crate *without* a feature (#204). zenkey-fleet's
  # five axes left with the v1 decode seam at FJ9 (#612); the axis left is
  # zenkey's `zenoh`, without which the runtime is the session-free half a
  # contract crate builds on.
  features:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo check -p zenkey --no-default-features --locked
      # zenkey-model is session-free (#608): zenoh-keyexpr, and no other
      # zenoh crate.
      - run: ./scripts/check-model-zenoh-free.sh

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo check --workspace --all-targets --all-features --locked

  docs:
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo doc --workspace --no-deps --locked

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      # the docker cargo-deny action cannot see deny.toml -> install directly
      - uses: https://github.com/taiki-e/install-action@v2.87.7
        with:
          tool: cargo-deny
      - run: cargo deny check
