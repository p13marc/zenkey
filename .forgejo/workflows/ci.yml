name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # shared compiler cache: sccache (mounted from the runner VM) -> garage S3
  # on vm-runner-01; S3 endpoint+credentials come from the runner's env_file
  RUSTC_WRAPPER: /srv/cache/bin/sccache
  CARGO_INCREMENTAL: "0"
  # Cap build parallelism: cargo otherwise defaults to nproc (6 on
  # vm-runner-01) per job, against a lane capacity of 2.
  CARGO_BUILD_JOBS: "2"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      # The gutter gate (#195): a multi-line string that lost its trailing `\`
      # keeps the source indentation *in the string*, so the user reads a
      # sentence with a hole in it. Seven shipped before anything looked.
      - run: python3 scripts/check-prose.py zenctl/src zenkey-fleet/src zengui/src zenkey/src
      # One report, three renderings, and exactly one place that decides which
      # (#198). Cheap, and it runs before the compiler like the gutter gate.
      - run: ./scripts/check-render-seam.sh

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    # zengui's pane tests build a real iced renderer per test, which probes
    # wgpu across every backend and every Vulkan ICD present. Unconstrained on
    # a headless runner that segfaults under the concurrency of a workspace
    # test run: measured at 12/128 runs of 8 concurrent copies of the panes
    # binary, against 0/224 with any constraint applied — `gl`, `vulkan`, a
    # single ICD, or --test-threads=1 all fixed it. The fault is upstream in
    # wgpu/mesa adapter enumeration; naming one backend is a mitigation, not a
    # repair, and the 42 pane tests stay enabled because they are how the
    # honesty surfaces are pinned (zenkey #229).
    env:
      WGPU_BACKEND: gl
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo build --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - run: cargo test -p zenkey --all-features --locked
      # Benches are a gate, not decoration: the baseline in
      # docs/bench-baseline.md is only worth reading if the code behind it
      # still compiles. Building them is cheap here (warm target dir) and
      # exercises the criterion harness link, which --all-targets does not.
      - run: cargo bench --workspace --no-run --locked

  # zenkey-fleet is published to crates.io advertising five feature axes, and
  # nothing built it without them: `clippy`/`msrv` use --all-features and
  # `test` uses the defaults. The `[[bench]] required-features = ["decode"]`
  # line exists precisely so --no-default-features *skips* that target, and
  # that path had never been executed (#204).
  features:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo check -p zenkey-fleet --no-default-features --locked
      # Each axis alone, not just the union: a `#[cfg(feature = "blob")]` item
      # that silently needs `decode` compiles under --all-features and breaks
      # for the consumer who asked for one of them.
      - run: cargo check -p zenkey-fleet --no-default-features --features blob --locked
      - run: cargo check -p zenkey-fleet --no-default-features --features decode --locked
      - run: cargo check -p zenkey-fleet --no-default-features --features decode-protobuf --locked
      - run: cargo check -p zenkey-fleet --no-default-features --features decode-cdr --locked
      - run: cargo check -p zenkey-fleet --no-default-features --features validate-json --locked
      - run: cargo bench -p zenkey-fleet --no-default-features --no-run --locked
      # zenkey-build runs in consumers' build scripts, and its manifest
      # promises the dependency graph stays light — so the exporters (#208)
      # are behind a feature, and both sides of it have to build.
      - run: cargo check -p zenkey-build --locked
      - run: cargo test -p zenkey-build --features export --locked

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo check --workspace --all-targets --all-features --locked

  docs:
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: cargo doc --workspace --no-deps --locked
