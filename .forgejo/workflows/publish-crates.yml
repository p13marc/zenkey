name: Publish crates
# Publishing is a decision, not a side effect: manual dispatch only.
on:
  workflow_dispatch:
    inputs:
      lane:
        description: "What to publish"
        required: true
        type: choice
        options:
          - crates-io-libs

env:
  # shared compiler cache: sccache (mounted from the runner VM) -> garage S3
  # on vm-runner-01; S3 endpoint+credentials come from the runner's env_file
  RUSTC_WRAPPER: /srv/cache/bin/sccache
  CARGO_INCREMENTAL: "0"

jobs:
  crates-io-libs:
    if: inputs.lane == 'crates-io-libs'
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo test --workspace --locked
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for crate in zenkey zenkey-build zenkey-fleet; do
            cargo publish -p "$crate" --locked
            sleep 30   # wait for index propagation before dependents publish
          done
