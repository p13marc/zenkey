[workspace]
resolver = "2"
members = [
    "zenkey",
    "zenkey-build",
    "zenkey-fleet",
    "fixture-tests",
    "zenctl",
    "zengui",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/p13marc/zenkey"
authors = ["Marc Pardo <p13marc@gmail.com>"]

[workspace.dependencies]
zenoh = { version = "1.9", features = ["unstable"] }
zenoh-ext = { version = "1.9", features = ["unstable"] }
# Standalone key-expression crate (same type zenoh re-exports; no tokio, no
# networking) — light enough for build scripts, which is why `Key` can wrap
# OwnedKeyExpr unconditionally (docs/redesign-2026-07.md §13).
zenoh-keyexpr = "1.9"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
arc-swap = "1"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ciborium = "0.2"
schemars = "1"
base64 = "0.22"
prost = "0.13"
prost-reflect = { version = "0.15", features = ["serde"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# GUI (zengui only). The `tokio` feature makes iced drive its subscriptions on a
# tokio runtime, which is what lets the Zenoh link stream live inside an
# `iced::Subscription`. Deliberately *not* `sipper`/`advanced`: the link is an
# `async_stream` yielding `Message` directly (zensight's shape), not tcgui's
# sipper-plus-remap.
iced = { version = "0.14", features = ["tokio"] }
iced_test = "0.14"
async-stream = "0.3"

# Internal
zenkey = { version = "0.4.0", path = "zenkey" }
zenkey-build = { version = "0.4.0", path = "zenkey-build" }
zenkey-fleet = { version = "0.3.0", path = "zenkey-fleet" }
