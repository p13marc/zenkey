[workspace]
resolver = "2"
members = [
    "zenkey",
    "zenkey-build",
    "fixture-tests",
    "zenctl",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/p13marc/zenkey"
authors = ["Marc Pardo <p13marc@gmail.com>"]

[workspace.dependencies]
zenoh = { version = "1.9", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ciborium = "0.2"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# Internal
zenkey = { version = "0.2.0", path = "zenkey" }
zenkey-build = { version = "0.2.0", path = "zenkey-build" }
