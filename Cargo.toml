[workspace]
resolver = "2"
members = [
    "zenkey",
    "zenkey-build",
    "zenkey-fleet",
    "zenkey-explorer-config",
    "fixture-tests",
    "report-fixtures",
    "zenctl",
    "zengui",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/p13marc/zenkey"
authors = ["Marc Pardo <p13marc@gmail.com>"]

[workspace.dependencies]
zenoh = { version = "1.10", features = ["unstable"] }
zenoh-ext = { version = "1.10", features = ["unstable"] }
# Standalone key-expression crate (same type zenoh re-exports; no tokio, no
# networking) — light enough for build scripts, which is why `Key` can wrap
# OwnedKeyExpr unconditionally (docs/redesign-2026-07.md §13).
zenoh-keyexpr = "1.10"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
toml = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
# `unstable-dynamic` is what makes cache-backed completion possible (#54);
# pinned to 4.6 so an unstable API cannot shift under a minor bump.
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
arc-swap = "1"
# The `Stream` trait itself, and `unfold` (#343). Both are already in the
# tree — zenoh and iced each pull `futures` 0.3 — so this is the same trait
# every consumer already speaks, not a second one. `futures-core` is the
# trait; `futures-util` is taken with default features off, for `unfold`
# alone, because a source whose `recv` borrows `&mut self` (a broadcast
# receiver) cannot be a self-referential struct without unsafe.
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }

# The watchdog is a *sequence plus a final value* (#397): transitions while it
# runs, a `WatchdogSummary` when it stops, and an acknowledged monitor teardown
# in between. A bare `Stream` has room for the first only, which is why the
# callback survived #343 — and inverting it by hand meant a state machine
# holding the tick's `select!` state, a pinned sweep future, a per-tick timer
# and a boxed `recv`, for a body that reads perfectly well as an `async fn`.
#
# `Sipper` is that shape as a type, and it takes an async block, so the body
# stays a body. This is a second streaming vocabulary beside `futures-core`,
# which the tree otherwise refuses — it earns the exception by being the one
# thing `Stream` cannot say. Its own deps (`futures` 0.3, `pin-project-lite`)
# are already here, and `iced` re-exports it behind an off-by-default feature,
# so a zengui watchdog surface would drive one with `Task::sip` and no bridge.
sipper = "0.1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ciborium = "0.2"
schemars = "1"
# default-features off on purpose: a served SchemaSet is self-contained
# (RFC 08 §7), so remote $ref resolution must not exist to fail.
jsonschema = { version = "0.49", default-features = false }
base64 = "0.23"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

# The CLI floor (#201). `trycmd` runs a corpus of `.trycmd` files — literate
# transcripts that double as documentation — against the built binary, and
# brings `snapbox` with it, which is where the render snapshots go. Both
# accept new output with an env var (`TRYCMD=overwrite`, `SNAPSHOTS=overwrite`)
# rather than a `cargo install`ed subcommand, which is what keeps `justfile`'s
# "plain cargo remains the build system" true.
trycmd = "1.2"
snapbox = "1.2"

# Colour (#200). Already in `Cargo.lock` via clap 4, so the dependency-tree
# cost is zero. `anstream` is a **dev**-dependency only: its `AutoStream`
# cannot wrap `emit`'s generic `impl Write`, and it is wanted here for exactly
# one thing — `adapter::strip_str`, in the test that proves stripping every
# escape is a no-op on meaning.
anstyle = "1"
anstyle-query = "1"
anstream = "1"

# GUI (zengui only). The `tokio` feature makes iced drive its subscriptions on a
# tokio runtime, which is what lets the Zenoh link stream live inside an
# `iced::Subscription`. Deliberately *not* `sipper`/`advanced`: the link is an
# `async_stream` yielding `Message` directly (zensight's shape), not tcgui's
# sipper-plus-remap.
#
# `async-stream` stays after #343, and deliberately. The engine now hands out
# real `Stream`s, so the *bridging* is gone — but `link.rs` is not a bridge,
# it is a stateful fold (batching to `BATCH_CAP`, coalescing counters, an
# `await` on `monitor.watched()` mid-stream, and a preamble and epilogue
# outside the loop). Expressing that as combinators over an explicit state
# struct is longer and worse, so the macro earns its place there.
#
# `canvas` is the one addition to that lean set (#64): a sparkline that draws a
# gap as a *break* in the line has no widget equivalent, and drawing gaps rather
# than bridging them is the honesty requirement, not a flourish. It buys no
# animation — nothing here declares a `frames()` subscription; the charts redraw
# on the same 250 ms bus tick as everything else.
iced = { version = "0.14", features = ["tokio", "canvas", "image"] }
iced_test = "0.14"
async-stream = "0.3"

# The RFC 07 reference client. `zenkey-fleet`'s optional `blob` feature is the
# only thing that pulls it in: RFC 07 §2 names it the reference client and §2.1
# makes per-reply verification-before-disk normative, so an explorer that
# fetched blobs any other way would be a second implementation of one integrity
# anchor. Not a zenkey dependency in either direction otherwise — zblob knows
# nothing about this convention, and the keys are spelled on our side.
zblob = "0.3"

# Internal
zenkey = { version = "0.7.0", path = "zenkey" }
zenkey-build = { version = "0.7.0", path = "zenkey-build" }
zenkey-fleet = { version = "0.11.0", path = "zenkey-fleet" }
zenkey-explorer-config = { version = "0.1.0", path = "zenkey-explorer-config" }
zenkey-report-fixtures = { path = "report-fixtures" }
