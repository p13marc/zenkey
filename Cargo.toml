[workspace]
resolver = "2"
members = [
    "zenkey",
    "zenctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/p13marc/zenkey"
authors = ["Marc Pardo <p13marc@gmail.com>"]

[workspace.dependencies]
zenoh = { version = "1.9", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Internal
zenkey = { path = "zenkey" }

# zenctl pulls zensight-common from the zensight repo, whose zenkey dependency
# is this very repo (git). Patch that git source to the local path so exactly
# one copy of zenkey exists — types cross the zensight-common API
# (refine_full_key returns StructuralKey/AnySubject), so two copies would
# mismatch (#3).
[patch."https://github.com/p13marc/zenkey"]
zenkey = { path = "zenkey" }
