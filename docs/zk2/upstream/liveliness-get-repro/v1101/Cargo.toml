[package]
name = "lgr-1101"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "lgr"
path = "../src/main.rs"

[[bin]]
name = "lgr-minimal"
path = "../src/minimal.rs"

[dependencies]
zenoh = { version = "=1.10.1", features = ["unstable"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "io-std", "fs", "sync"] }
flume = "0.11"

[profile.release]
debug = 1
