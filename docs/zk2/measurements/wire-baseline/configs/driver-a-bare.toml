# Driver A of #989's wire baseline: the RF end the zk2 owner's router dials.
# A udp-medium bearer (lab-air), paced to rf()'s 2400 bit/s with its 220-byte
# frame; loss and latency come from the relay between the two drivers.
socket_dir = "@WORK@/run/a"

[[device]]
name = "rfa"
zenoh_batch_size = 222

[device.medium]
kind = "udp"
bind = "127.0.0.1:17410"
max_sdu = 220
rate_bps = 2400

[device.medium.peers]
b = "127.0.0.1:17412"

[[device.endpoints]]
name = "b"
role = "bind"

[[device.endpoints.lanes]]
name = "air"
reliable = false
priorities = [0, 7]

[management]
listen = ["unixsock-stream/@WORK@/run/a/mgmt.sock"]
telemetry_interval_ms = 1000
