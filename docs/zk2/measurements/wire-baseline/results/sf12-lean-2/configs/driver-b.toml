# Driver B of #989's wire baseline (LoRa SF12, EU868, 51-byte tiles, lean stack).
# A udp-medium bearer (lab-air) paced to 293 bit/s with a 51-byte
# frame; loss and latency come from the relay between the two drivers.
# Rendered by render.py from configs/driver.toml.in.
socket_dir = "/srv/dev/targets/zenkey-989/run/lora12/b"
# The aead layer's nonce counters (--init-layer-state).
state_dir = "/srv/dev/targets/zenkey-989/state/lora12/b"

[[device]]
name = "rfb"
# fragment's mtu 222 - 14 (compress 1, aead 13) + Zenoh's 2-byte length prefix
zenoh_batch_size = 210

[device.medium]
kind = "udp"
bind = "127.0.0.1:17711"
max_sdu = 51
rate_bps = 293

[device.medium.peers]
a = "127.0.0.1:17713"

[[device.endpoints]]
name = "a"
role = "dial"

[[device.endpoints.lanes]]
name = "air"
reliable = false
priorities = [0, 7]

# The lean stack (constrained-overhead-review.md §3.2), in the order an
# outgoing SDU meets it, nearest the scheduler first.
[[device.layers]]
kind = "compress"                         # 1 byte stored, or 3 + a zstd body
dictionary_file = "/srv/dev/targets/zenkey-989/cfg/lora12/rf.zdict"
level = 3

[[device.layers]]
kind = "aead"                             # 1 + 4 + 8 = 13 bytes
suite = "aes-128-ccm"
tag_bytes = 8
mode = "sealed"
key_file = "/srv/dev/targets/zenkey-989/cfg/rf.keys"
key_id = 0
accept = [0]
self = "b"

# SCHC No-ACK tiles below Zenoh's 80-byte floor (deploy/README.md): Zenoh
# sees an SDU of 222 bytes, the medium tiles of 51.
[[device.layers]]
kind = "fragment"
mtu = 222
timeout_ms = 13000

# Stands in for the address layer's 2 bytes (dst, src): layer-address refuses
# the udp medium ("unknown lane */be#0"), which addresses peers itself.
[[device.layers]]
kind = "overhead"
bytes = 2

# The management plane on a unix socket of its own, never on the data
# routers, so none of it crosses the air.
[management]
listen = ["unixsock-stream//srv/dev/targets/zenkey-989/run/lora12/b/mgmt.sock"]
telemetry_interval_ms = 1000
