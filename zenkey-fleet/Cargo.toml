[package]
name = "zenkey-fleet"
description = "Fleet engine for keyspace-v2 Zenoh tooling: disciplined fan-in queries, liveliness roster, registry-slice sets, schema-aware decode, live key-tree monitoring — the shared core of zenctl and zengui"
readme = "README.md"
keywords = ["zenoh", "keyspace", "explorer", "fleet"]
categories = ["network-programming", "development-tools"]
license = "Apache-2.0"
version = "0.11.1"
rust-version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["decode"]
decode = ["zenkey/decode"]
# The direct prost-reflect dep is for gen's descriptor-driven synthesis
# (#162); the codec itself lives in zenkey.
decode-protobuf = ["zenkey/decode-protobuf", "dep:prost-reflect"]
decode-cdr = ["zenkey/decode-cdr"]
# Real JSON Schema validation behind decode verdicts (#159) — forwarded so
# both explorers judge payloads, while a bare library consumer pays nothing.
validate-json = ["zenkey/validate-json"]
# The `@blob` transport (RFC 07 §2.5's probe and fetch), which pulls in the
# reference client and its hashing stack. Off by default: the registry
# projection and the report shapes are unconditional, so a library consumer
# that only renders a blob report pays nothing, while both explorers turn it on.
blob = ["dep:zblob"]

# docs.rs builds once per published version and cannot be re-run for it, so
# the feature-gated surface has to be right *before* the publish, not after
# (#325). `all-features` documents every axis; the two rustdoc flags annotate
# each item with the feature that gates it, which is the half a reader
# actually needs — otherwise a `#[cfg(feature = "blob")]` item reads as
# unconditionally available.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "-Zunstable-options", "--generate-link-to-definition"]

[dependencies]
zenkey = { workspace = true, features = ["schema"] }
zblob = { workspace = true, optional = true }
prost-reflect = { workspace = true, optional = true }
zenoh = { workspace = true }
zenoh-ext = { workspace = true }
tokio = { workspace = true }
# The event sources are `Stream`s (#343). An engine whose consumers all reach
# for streams should not make each of them rebuild the adapter — zengui carried
# one purely to bridge. Same `futures` 0.3 that zenoh and iced already pull, so
# this is one trait across the tree for every source that is *only* a sequence.
futures-core = { workspace = true }
futures-util = { workspace = true }
# The watchdog yields transitions *and* returns a summary (#397) — the shape
# `futures-core` above has no room for. See the workspace manifest for why the
# second vocabulary earns its place.
sipper = { workspace = true }
# The crate's own error surface (#348) — a published library owes its
# consumers a type to match on, not a sentence to grep. `anyhow` left with
# it: an engine that classifies its own failures has nothing to erase them
# into.
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The `.zrec` row dialect carries wire payloads lossless (RFC 09 §5.2) —
# `"value"` is a rendering; `"bytes"` is the payload.
base64 = { workspace = true }
ciborium = { workspace = true }
arc-swap = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The enrollment file's parse test only (`report::acl`); the library never
# reads a TOML — that is the frontend's job, as it is for every other file.
toml = { workspace = true }
# The report values `tests/report_contract.rs` is written against, shared with
# zenctl's render tests so the two corpora cannot drift about what a report
# *is* (#201). A dev-dependency cycle — this crate depends on that one — which
# cargo permits because the dev edge is cut when building the dependency.
zenkey-report-fixtures = { workspace = true }
# `test-util` on top of the workspace features: paused time, so a cancellation
# window is an exact number of milliseconds rather than a race (#328).
tokio = { workspace = true, features = ["test-util"] }
# The engine's hot paths are benched here rather than in a consumer, because
# they are the paths BOTH explorers run per sample and per tick (#44).
criterion = { workspace = true }
# Fixture payloads for the decode benches; the crate itself does not need it.
serde_json = { workspace = true }
ciborium = { workspace = true }
# Fixture descriptor sets for the codec round-trip test (#97) — built through
# prost-types rather than hand-encoded bytes, so the fixture stays readable.
prost-reflect = { workspace = true }
# The codec registration lives in zenkey, so enabling it here turns the
# protobuf decoder on for *this crate's tests* without touching what the
# library ships. `cargo test -p zenkey-fleet` then covers `tests/codec.rs`
# on its own, instead of only when a frontend happens to unify the feature in.
zenkey = { workspace = true, features = ["decode-protobuf", "decode-cdr", "validate-json"] }
# `tests/blob.rs` fetches to a real path, because "verified before disk" is
# only checkable against a disk.
tempfile = { workspace = true }

[[bench]]
name = "fleet"
harness = false
# The `decode/*` benches need the decode seam; `decode` is on by default, and
# naming it here means `--no-default-features` skips the target rather than
# failing to compile it.
required-features = ["decode"]
