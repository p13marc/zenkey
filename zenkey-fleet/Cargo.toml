[package]
name = "zenkey-fleet"
description = "Fleet engine for keyspace-v2 Zenoh tooling: disciplined fan-in queries, liveliness roster, registry-slice sets, schema-aware decode, live key-tree monitoring — the shared core of zenctl and zengui"
readme = "README.md"
keywords = ["zenoh", "keyspace", "explorer", "fleet"]
categories = ["network-programming", "development-tools"]
license = "Apache-2.0"
version = "0.9.0"
rust-version = "1.97"
edition.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["decode"]
decode = ["zenkey/decode"]
decode-protobuf = ["zenkey/decode-protobuf"]
decode-cdr = ["zenkey/decode-cdr"]
# Real JSON Schema validation behind decode verdicts (#159) — forwarded so
# both explorers judge payloads, while a bare library consumer pays nothing.
validate-json = ["zenkey/validate-json"]
# The `@blob` transport (RFC 07 §2.5's probe and fetch), which pulls in the
# reference client and its hashing stack. Off by default: the registry
# projection and the report shapes are unconditional, so a library consumer
# that only renders a blob report pays nothing, while both explorers turn it on.
blob = ["dep:zblob"]

[dependencies]
zenkey = { workspace = true, features = ["schema"] }
zblob = { workspace = true, optional = true }
zenoh = { workspace = true }
zenoh-ext = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The `.zrec` row dialect carries wire payloads lossless (RFC 09 §5.2) —
# `"value"` is a rendering; `"bytes"` is the payload.
base64 = { workspace = true }
ciborium = { workspace = true }
arc-swap = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# The engine's hot paths are benched here rather than in a consumer, because
# they are the paths BOTH explorers run per sample and per tick (#44).
criterion = { workspace = true }
# Fixture payloads for the decode benches; the crate itself does not need it.
serde_json = { workspace = true }
ciborium = { workspace = true }
# Fixture descriptor sets for the codec round-trip test (#97) — built through
# prost-types rather than hand-encoded bytes, so the fixture stays readable.
prost-reflect = { workspace = true }
# The codec registration lives in zenkey, so enabling it here turns the
# protobuf decoder on for *this crate's tests* without touching what the
# library ships. `cargo test -p zenkey-fleet` then covers `tests/codec.rs`
# on its own, instead of only when a frontend happens to unify the feature in.
zenkey = { workspace = true, features = ["decode-protobuf", "decode-cdr", "validate-json"] }
# `tests/blob.rs` fetches to a real path, because "verified before disk" is
# only checkable against a disk.
tempfile = { workspace = true }

[[bench]]
name = "fleet"
harness = false
# The `decode/*` benches need the decode seam; `decode` is on by default, and
# naming it here means `--no-default-features` skips the target rather than
# failing to compile it.
required-features = ["decode"]
