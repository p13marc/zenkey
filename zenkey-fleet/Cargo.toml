[package]
name = "zenkey-fleet"
description = "Fleet engine for zk2 Zenoh tooling: disciplined fan-in queries, presence, contract-resolved decode through a lens, live key-tree monitoring, recording and replay — the shared core of the zk2 explorers"
readme = "README.md"
keywords = ["zenoh", "keyspace", "explorer", "fleet"]
categories = ["network-programming", "development-tools"]
license = "Apache-2.0"
version = "0.20.0"
# Being ported to zk2 (#612). 0.18.0 on crates.io is the v1 engine zengui and
# zenwatch pin until #614 re-targets them; nothing is published from `main`
# until the port completes (decided 2026-10-08).
publish = false
rust-version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true

# No feature axes since FJ9 (#612): the v1 decode seam and its codec
# features left with the v1 dependency, and zk2's decode
# (`zenkey_model::decode`) is unconditional.

# `--generate-link-to-definition` for docs.rs, which builds on nightly.
[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "-Zunstable-options", "--generate-link-to-definition"]

[dependencies]
# The zk2 runtime (#612, FJ3). It took the name back at FJ9, when the v1
# library this crate used to pin from crates.io (`zenkey =0.11.1`) left.
zenkey = { path = "../zenkey" }
zenkey-model = { path = "../zenkey-model" }
# gen's descriptor-driven synthesis (#162), and the descriptor sets zk2's
# `schema show` reads (FJ4).
prost-reflect = { workspace = true }
zenoh = { workspace = true }
zenoh-ext = { workspace = true }
tokio = { workspace = true }
# The event sources are `Stream`s (#343). An engine whose consumers all reach
# for streams should not make each of them rebuild the adapter — zengui carried
# one purely to bridge. Same `futures` 0.3 that zenoh and iced already pull, so
# this is one trait across the tree for every source that is *only* a sequence.
futures-core = { workspace = true }
futures-util = { workspace = true }
# The watchdog yields transitions *and* returns a summary (#397) — the shape
# `futures-core` above has no room for. See the workspace manifest for why the
# second vocabulary earns its place.
sipper = { workspace = true }
# The crate's own error surface (#348) — a published library owes its
# consumers a type to match on, not a sentence to grep. `anyhow` left with
# it: an engine that classifies its own failures has nothing to erase them
# into.
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# A `--zenoh-config` file is read twice: by zenoh, which fills every key the
# file left out with its default, and raw, to learn which keys the file
# actually *states* — the explorer's posture (client, multicast off) yields to
# a stated choice and to nothing else (#501, #502). JSON5 and YAML because
# those are the dialects `zenoh::Config::from_file` accepts.
json5 = { workspace = true }
serde_yaml = { workspace = true }
# The `.zrec` row dialect carries wire payloads lossless (RFC 09 §5.2) —
# `"value"` is a rendering; `"bytes"` is the payload.
base64 = { workspace = true }
ciborium = { workspace = true }
arc-swap = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The enrollment file's parse test only (`report::acl`); the library never
# reads a TOML — that is the frontend's job, as it is for every other file.
toml = { workspace = true }
# The report values `tests/report_contract.rs` is written against, shared with
# zenctl's render tests so the two corpora cannot drift about what a report
# *is* (#201). A dev-dependency cycle — this crate depends on that one — which
# cargo permits because the dev edge is cut when building the dependency.
zenkey-report-fixtures = { workspace = true }
# `test-util` on top of the workspace features: paused time, so a cancellation
# window is an exact number of milliseconds rather than a race (#328).
tokio = { workspace = true, features = ["test-util"] }
# The engine's hot paths are benched here rather than in a consumer, because
# they are the paths BOTH explorers run per sample and per tick (#44).
criterion = { workspace = true }

[[bench]]
name = "fleet"
harness = false
