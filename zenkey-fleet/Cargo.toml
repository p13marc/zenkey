[package]
name = "zenkey-fleet"
description = "Fleet engine for keyspace-v2 Zenoh tooling: disciplined fan-in queries, liveliness roster, registry-slice sets, schema-aware decode, live key-tree monitoring — the shared core of zenctl and zengui"
readme = "README.md"
keywords = ["zenoh", "keyspace", "explorer", "fleet"]
categories = ["network-programming", "development-tools"]
license = "Apache-2.0"
version = "0.6.0"
rust-version = "1.97"
edition.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["decode"]
decode = ["zenkey/decode"]
decode-protobuf = ["zenkey/decode-protobuf"]

[dependencies]
zenkey = { workspace = true, features = ["schema"] }
zenoh = { workspace = true }
zenoh-ext = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ciborium = { workspace = true }
arc-swap = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# Fixture descriptor sets for the codec round-trip test (#97) — built through
# prost-types rather than hand-encoded bytes, so the fixture stays readable.
prost-reflect = { workspace = true }
# The codec registration lives in zenkey, so enabling it here turns the
# protobuf decoder on for *this crate's tests* without touching what the
# library ships. `cargo test -p zenkey-fleet` then covers `tests/codec.rs`
# on its own, instead of only when a frontend happens to unify the feature in.
zenkey = { workspace = true, features = ["decode-protobuf"] }
