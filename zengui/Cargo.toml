[package]
name = "zengui"
version = "0.2.0"
# Publication policy (docs/redesign-2026-07.md §15): binaries are never
# published to crates.io. zengui ships through the Forgejo release lane
# (`release.yml`) / `cargo install --git`, exactly as zenctl does.
publish = false
edition.workspace = true
authors.workspace = true
repository.workspace = true
description = "Graphical bus explorer for Zenoh — key-agnostic, with keyspace-v2 (zenkey) enrichment"
readme = "README.md"
keywords = ["zenoh", "keyspace", "gui", "explorer"]
categories = ["gui", "network-programming"]
rust-version = "1.97"
license = "Apache-2.0"

[[bin]]
name = "zengui"
path = "src/main.rs"

[dependencies]
zenkey = { workspace = true }
# Same feature set as zenctl (#97, #98, #58) — the two explorers must not
# disagree about which payloads they can read, nor about which planes they
# can reach.
zenkey-fleet = { workspace = true, features = ["blob", "decode-protobuf", "decode-cdr"] }

zenoh = { workspace = true }
iced = { workspace = true }
async-stream = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
iced_test = { workspace = true }
# The `spray` example serves a protobuf descriptor set (#97) so the demo has a
# subject only a served schema can decode.
prost-reflect = { workspace = true }
zenkey = { workspace = true, features = ["schema"] }
