[package]
name = "zengui"
version = "0.7.0"
# Publication policy (docs/redesign-2026-07.md §15): binaries are never
# published to crates.io. zengui ships through the Forgejo release lane
# (`release.yml`) / `cargo install --git`, exactly as zenctl does.
publish = false
edition.workspace = true
authors.workspace = true
repository.workspace = true
description = "Graphical bus explorer for Zenoh — key-agnostic, with keyspace-v2 (zenkey) enrichment"
readme = "README.md"
keywords = ["zenoh", "keyspace", "gui", "explorer"]
categories = ["gui", "network-programming"]
rust-version.workspace = true
license = "Apache-2.0"

[[bin]]
name = "zengui"
path = "src/main.rs"

[dependencies]
# zk2's engine and its session-free model, by path, as zenctl and zenwatch
# take them. v1's runtime and engine (`zenkey =0.11.1`, `zenkey-fleet
# =0.18.0`), which zengui read under renamed dependencies while #614 moved
# it pane by pane, left at FL11b; their sources live on the `v1` branch.
zenkey-fleet = { path = "../zenkey-fleet" }
zenkey-model = { path = "../zenkey-model" }
zenkey-explorer-config = { workspace = true }

zenoh = { workspace = true }
iced = { workspace = true }
async-stream = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
iced_test = { workspace = true }
ttf-parser = { workspace = true }
# The zk2 runtime: the `spray` example's `host-a/sysmon` is a service of its
# own, brought up with `ServiceBuilder` and `health.v1` (#614, FL5).
zenkey = { path = "../zenkey" }
criterion = { workspace = true }

[[bench]]
name = "frame"
harness = false
