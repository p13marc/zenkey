[package]
name = "zengui"
version = "0.7.0"
# Publication policy (docs/redesign-2026-07.md §15): binaries are never
# published to crates.io. zengui ships through the Forgejo release lane
# (`release.yml`) / `cargo install --git`, exactly as zenctl does.
publish = false
edition.workspace = true
authors.workspace = true
repository.workspace = true
description = "Graphical bus explorer for Zenoh — key-agnostic, with keyspace-v2 (zenkey) enrichment"
readme = "README.md"
keywords = ["zenoh", "keyspace", "gui", "explorer"]
categories = ["gui", "network-programming"]
rust-version.workspace = true
license = "Apache-2.0"

[[bin]]
name = "zengui"
path = "src/main.rs"

[dependencies]
# The strangler (#614, FL5): v1's runtime and engine from crates.io under
# renamed dependencies (`zenkey_v1::`, `zenkey_fleet_v1::`), so the in-tree
# zk2 crates below sit beside them under their own names while the panes
# move one by one. Spelled inline, as zenwatch's were in FL2, so the pins
# live with their one user; FL11 deletes both.
#
# The Config tool (#481) deserializes the RFC 05 §5.1 read-back.
zenkey-v1 = { package = "zenkey", version = "=0.11.1", features = ["serde"] }
# The feature set v1's zenctl had (#97, #98, #58): the two explorers must
# not disagree about which payloads they can read, nor about which planes
# they can reach.
zenkey-fleet-v1 = { package = "zenkey-fleet", version = "=0.18.0", features = ["blob", "decode-protobuf", "decode-cdr", "validate-json"] }
# zk2's engine and its session-free model, by path, as zenctl and zenwatch
# take them. Nothing in the GUI uses them yet; FL6 onward ports the panes.
zenkey-fleet = { path = "../zenkey-fleet" }
zenkey-model = { path = "../zenkey-model" }
zenkey-explorer-config = { workspace = true }

zenoh = { workspace = true }
iced = { workspace = true }
async-stream = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
iced_test = { workspace = true }
ttf-parser = { workspace = true }
# The `spray_v1` example serves a protobuf descriptor set (#97) so the demo
# has a subject only a served schema can decode.
prost-reflect = { workspace = true }
# v1's `schema` feature: `spray_v1` serves a v1 `describe` (RFC 08 §7).
zenkey-v1 = { package = "zenkey", version = "=0.11.1", features = ["schema"] }
# The zk2 runtime: the `spray` example's `host-a/sysmon` is a service of its
# own, brought up with `ServiceBuilder` and `health.v1` (#614, FL5).
zenkey = { path = "../zenkey" }
criterion = { workspace = true }

[[bench]]
name = "frame"
harness = false
