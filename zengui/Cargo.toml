[package]
name = "zengui"
version = "0.1.0"
# Publication policy (docs/redesign-2026-07.md §15): binaries are never
# published to crates.io. zengui ships through the Forgejo release lane
# (`release.yml`) / `cargo install --git`, exactly as zenctl does.
publish = false
edition.workspace = true
authors.workspace = true
repository.workspace = true
description = "Graphical bus explorer for Zenoh — key-agnostic, with keyspace-v2 (zenkey) enrichment"
readme = "README.md"
keywords = ["zenoh", "keyspace", "gui", "explorer"]
categories = ["gui", "network-programming"]
rust-version = "1.97"
license = "Apache-2.0"

[[bin]]
name = "zengui"
path = "src/main.rs"

[dependencies]
zenkey = { workspace = true }
zenkey-fleet = { workspace = true }

zenoh = { workspace = true }
iced = { workspace = true }
async-stream = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
iced_test = { workspace = true }
