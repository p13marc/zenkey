# The report values both corpora are written against (#201).
#
# `zenkey-fleet/tests/report_contract.rs` pins their *wire* shape; `zenctl`'s
# render tests pin how those same values are *drawn*. One set of constructors
# so a field added to a report breaks one place, and both corpora then re-run
# against the same thing — which is the only way the two stay in agreement
# about what a report is.
[package]
name = "zenkey-report-fixtures"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The in-tree engine, by path, as every member takes it.
zenkey-fleet = { path = "../zenkey-fleet" }
serde_json = { workspace = true }
# The ACL plan's contract (#612, FJ7), loaded from its authoring text so the
# plan is the planner's own. The model crate is session-free: it requests no
# feature of zenkey-fleet and pulls no zenoh session.
zenkey-model = { path = "../zenkey-model" }
