# operations.md §3 and §9: every error is the error form under zenoh/bytes,
# its detail the error type's own bytes (core §5.2): JSON, CBOR, protobuf,
# raw.
[interface]
name = "encodings"
major = 1
minor = 0

[schemas]
protobuf = ["schemas/sensor.proto"]
jsonschema = ["schemas/tc.json"]

[resources.json]
kind = "operation"
request = "json:SetRequest"
response = "json:SetResponse"

[resources.cbor]
kind = "operation"
request = "json:SetRequest"
response = "json:SetResponse"
encoding = "cbor"

[resources.proto]
kind = "operation"
request = "sensor.v1.Pose"
response = "sensor.v1.Pose"

[resources.raw]
kind = "operation"
request = { raw = "text/plain" }
response = { raw = "text/plain" }

[resources.proto-error]
kind = "operation"
request = "json:SetRequest"
response = "json:SetResponse"
error = "sensor.v1.Pose"

[resources.cbor-error]
kind = "operation"
request = "sensor.v1.Pose"
response = "sensor.v1.Pose"
error = "json:TcError"
encoding = "cbor"

# §3 step 6: a raw `error` type, whose detail is its bytes, never base64.
[resources.raw-error]
kind = "operation"
request = { raw = "text/plain" }
response = { raw = "text/plain" }
error = { raw = "image/jpeg" }

[resources.json-error]
kind = "operation"
request = "json:SetRequest"
response = "json:SetResponse"
error = "json:TcError"
