# rudder.v1.toml: what an actuator requires
[interface]
name  = "rudder"
major = 1
minor = 0
uses  = ["arbitration.v1"]

[resources.angle]                # the last command delivered
kind = "state"
type = { raw = "text/plain" }

[requires.cmd]
interface   = "steer.v1"
resources   = ["cmd"]
cardinality = "many"
annotations = { "arbitration.policy" = "priority" }
