# The third of three interfaces one owner heartbeat covers (#1110's H2b,
# `tests/owner_heartbeat.rs`): a collection of each class, so its groups
# ride both owner heartbeat keys.
[interface]
name  = "charlie"
major = 1
minor = 0
uses  = ["freshness.v1", "link.v1"]

[resources.status]
kind        = "state"
type        = { raw = "text/plain" }
annotations = { "freshness.ttl_s" = 2 }

[resources.reach]
kind        = "state"
type        = { raw = "text/plain" }
annotations = { "freshness.ttl_s" = 2, "link.exposure" = "link" }
