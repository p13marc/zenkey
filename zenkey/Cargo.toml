[package]
name = "zenkey"
description = "Executable form of the keyspace-v2 Zenoh semantic convention: typed key grammar, origin minting, slugs, QoS profiles, registry slices"
readme = "README.md"
keywords = ["zenoh", "keyspace", "semantic-convention", "pubsub"]
categories = ["network-programming"]
rust-version = "1.97"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["zenoh"]
# QosProfile -> zenoh QoS triple mappings. Off in build scripts (zenkey-build
# depends on this crate with default-features = false) so codegen never pulls
# the zenoh stack into build-dependencies.
zenoh = ["dep:zenoh"]
# Wire representations for HostId/RemoteOrigin (plain strings, validated on
# deserialize) — applications carry origins in health documents (RFC 06 §6).
serde = ["dep:serde"]
# SchemaSet/TypeSchema — the RFC 08 §7 payload self-description types
# (producer side: build + serve a describe reply; consumer side: parse one).
schema = ["serde", "dep:serde_json", "dep:base64"]
# TypeSchema::json_schema_of::<T>() — derive-driven schema production.
schemars = ["schema", "dep:schemars"]
# Generic decode/encode against a TypeSchema (json-schema kind: JSON + CBOR).
decode = ["schema", "dep:ciborium"]
# Protobuf decode via a served FileDescriptorSet (prost-reflect DynamicMessage).
decode-protobuf = ["decode", "dep:prost-reflect", "dep:prost"]

[dependencies]
zenoh = { workspace = true, optional = true }
# Unconditional: `Key`/`Selector` wrap OwnedKeyExpr (RFC 08 §1.2). The
# standalone crate is std-only — safe in build-dependency graphs.
zenoh-keyexpr = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
ciborium = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
prost-reflect = { workspace = true, optional = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
# Runtime, not just build-time: `introspect` replies with a registry slice, so a
# consumer needs the TOML parser to read one (RFC 08 §6, issue #469).
toml = "0.8"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "keys"
harness = false
