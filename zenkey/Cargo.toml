[package]
name = "zenkey"
version = "0.20.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
authors.workspace = true
description = "The zk2 runtime: services, presence, descriptors and contract retrieval over Zenoh"
# Not on crates.io until the zk2 runtime chunks land (#610 onward). The v1
# tools on `main` build against `zenkey =0.11.1` from crates.io meanwhile.
# Both resolve side by side: `-p zenkey` selects this member, and only
# whole-graph commands (`cargo pkgid`, `cargo tree -i`) need `zenkey@0.20.0`.
publish = false

[features]
default = ["zenoh"]
# Everything that holds a session. Without it, the crate is the model,
# `config`, `Implementation`, `call` and `codec`: what a contract crate
# generated by zenkey-build needs for its types and its `Handlers`/`Api`
# traits, with no zenoh crate beyond zenoh-keyexpr (#611).
zenoh = ["dep:zenoh", "dep:zenoh-ext", "dep:flume", "dep:tokio", "dep:libc", "dep:rand", "dep:tracing"]

[dependencies]
zenkey-model = { path = "../zenkey-model" }
zenoh = { workspace = true, optional = true }
# An unbounded liveliness and reply handler (spec §8.1: zenoh's default
# 256-slot handler hangs a liveliness GET on a session that also holds a
# liveliness subscriber, zenoh#2678). zenoh implements `IntoHandler` for a
# flume pair, and its sender drops when the query finalizes: completion.
flume = { version = "0.11", optional = true }
# zenoh runs on tokio; the runtime's timeouts use it too.
tokio = { workspace = true, optional = true }
zenoh-ext = { workspace = true, optional = true }
ciborium = { workspace = true }
libc = { version = "0.2", optional = true }
rand = { version = "0.9", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
# The protobuf codec (#611) and the well-known types generated code names.
# Both are already in the tree through zenkey-model. They are re-exported,
# so a generated message's prost is always the codec's.
prost = { workspace = true }
prost-types = "0.14"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "typed_path"
harness = false
